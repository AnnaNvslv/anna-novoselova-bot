<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Гинтер Оптика — CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="css/crm.css?v=3">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

<div id="mobile-nav">
  <button class="mob-nav-item" id="mob-nav-dashboard" onclick="nav('dashboard');_mobActive()">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    <span>Главная</span>
  </button>
  <button class="mob-nav-item" id="mob-nav-patients" onclick="nav('patients');_mobActive()">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
    <span>Пациенты</span>
  </button>
  <button class="mob-nav-item" id="mob-nav-appointments" onclick="nav('appointments');_mobActive()">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    <span>Приёмы</span>
  </button>
  <button class="mob-nav-item" id="mob-nav-orders" onclick="nav('orders');_mobActive()">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
    <span>Заказы</span>
  </button>
  <button class="mob-nav-item" id="mob-nav-slots" onclick="nav('slots');_mobActive()">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    <span>График</span>
  </button>
  <button class="mob-nav-item" id="mob-nav-analytics" onclick="nav('analytics');_mobActive()">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    <span>Аналит.</span>
  </button>
  <button class="mob-nav-item" id="mob-nav-settings" onclick="nav('settings');_mobActive()">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    <span>Настройки</span>
  </button>
  <button class="mob-nav-item" id="mob-nav-trash" onclick="nav('trash');_mobActive()">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
    <span>Korpa</span>
  </button>
</div>

<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">👁</div>
    <h2>Гинтер Оптика</h2>
    <p>CRM система — введите PIN</p>
    <input type="password" id="pin-input" maxlength="8" placeholder="• • • •" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">Войти</button>
    <div id="login-err" class="login-err"></div>
  </div>
</div>

<div id="app" style="display:none">
  <nav class="sidebar">
    <div class="sb-logo"><h2>👁 Гинтер Оптика</h2><p>CRM система</p></div>
    <div class="sb-nav">
      <div class="sb-item active" onclick="nav('dashboard')" id="nav-dashboard">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span class="sb-label">Главная</span>
      </div>
      <div class="sb-item" onclick="nav('patients')" id="nav-patients">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span class="sb-label">Пациенты</span>
      </div>
      <div class="sb-item" onclick="nav('appointments')" id="nav-appointments">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span class="sb-label">Приёмы</span>
      </div>
      <div class="sb-item" onclick="nav('orders')" id="nav-orders">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><span class="sb-label">Заказы</span>
      </div>
      <div class="sb-item" onclick="nav('analytics')" id="nav-analytics">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg><span class="sb-label">Аналитика</span>
      </div>
      <div class="sb-item" onclick="nav('slots')" id="nav-slots">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span class="sb-label">Расписание</span>
      </div>
      <div class="sb-item" onclick="nav('settings')" id="nav-settings">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span class="sb-label">Настройки</span>
      </div>
    </div>
    <div class="sb-footer">
      <div class="sb-role" id="sb-role-label">—</div>
      <div style="display:flex;gap:6px;padding:4px 12px 8px">
        <button class="lang-btn" data-lang="sr" onclick="switchLang('sr')" style="background:none;border:none;cursor:pointer;font-size:12px;font-weight:800;color:white;padding:2px 6px;border-radius:4px;letter-spacing:.5px">SRB</button>
        <span style="color:rgba(255,255,255,.3);font-size:12px">|</span>
        <button class="lang-btn" data-lang="ru" onclick="switchLang('ru')" style="background:none;border:none;cursor:pointer;font-size:12px;font-weight:400;color:rgba(255,255,255,.5);padding:2px 6px;border-radius:4px;letter-spacing:.5px">RUS</button>
      </div>
      <div class="sb-item" onclick="nav('trash')" id="nav-trash">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg><span class="sb-label">Korpa</span>
      </div>
      <div class="sb-item" onclick="logout()" style="color:rgba(255,255,255,.5);font-size:13px">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="15" height="15"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Выйти
      </div>
    </div>
  </nav>
  <div class="main"><div id="content"></div></div>
</div>

<div class="overlay hidden" id="overlay" onclick="overlayClick(event)"><div id="modal-container"></div></div>
<div id="print-area"></div>
<div id="toast"></div>

<script src="js/i18n.js?v=11"></script>
<script src="js/config.js?v=10"></script>
<script src="js/utils.js?v=10"></script>
<script src="js/auth.js?v=13"></script>
<script src="js/telegram.js?v=10"></script>
<script src="js/router.js?v=10"></script>
<script src="js/dashboard.js?v=10"></script>
<script src="js/patients.js?v=12"></script>
<script src="js/appointments.js?v=11"></script>
<script src="js/orders.js?v=13"></script>
<script src="js/analytics.js?v=12"></script>
<script src="js/calendar.js?v=11"></script>
<script src="js/exam.js?v=12"></script>
<script src="js/settings.js?v=10"></script>
<script src="js/trash.js?v=10"></script>
<script src="js/export.js?v=10"></script>
<script>
function _mobActive(){
  var s=window.curSection||'dashboard';
  document.querySelectorAll('.mob-nav-item').forEach(function(b){
    b.classList.toggle('active',b.id==='mob-nav-'+s);
  });
}
</script>
</body>
</html>
