<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Гинтер Оптика — CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#EDEAE4;--surface:#FFF;--surface2:#F5F2ED;
  --primary:#1B4F72;--primary-h:#154060;--primary-l:#D4E8F5;
  --accent:#0891b2;--accent-h:#0369a1;--accent-l:#e0f2fe;
  --text:#18202E;--text-m:#64748B;--text-l:#94A3B8;
  --border:#DDD8D0;
  --green:#047857;--green-l:#D1FAE5;
  --warn:#d97706;--warn-l:#FEF3C7;
  --red:#B91C1C;--red-l:#FEE2E2;
  --blue:#1D4ED8;--blue-l:#DBEAFE;
  --sidebar:224px;--r:10px;--r-sm:6px;
  --shadow:0 1px 4px rgba(0,0,0,.08);--shadow-md:0 4px 20px rgba(0,0,0,.14)
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Onest',sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}

/* LOGIN */
#login-screen{position:fixed;inset:0;background:linear-gradient(135deg,#1B4F72,#0891b2);display:flex;align-items:center;justify-content:center;z-index:999}
.login-box{background:#fff;border-radius:18px;padding:44px 52px;width:340px;text-align:center;box-shadow:0 16px 48px rgba(0,0,0,.28)}
.login-logo{font-size:36px;margin-bottom:10px}
.login-box h2{font-size:22px;font-weight:800;margin-bottom:4px}
.login-box p{font-size:13px;color:var(--text-m);margin-bottom:28px}
.login-box input{width:100%;padding:13px;border:1.5px solid var(--border);border-radius:9px;font-family:inherit;font-size:20px;text-align:center;letter-spacing:8px;margin-bottom:12px;outline:none}
.login-box input:focus{border-color:var(--accent)}
.login-box button{width:100%;padding:13px;background:var(--accent);color:#fff;border:none;border-radius:9px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}
.login-box button:hover{background:var(--accent-h)}
.login-err{color:var(--red);font-size:13px;margin-top:8px;min-height:18px}

/* APP */
#app{display:none;min-height:100vh;flex-direction:row}
.sidebar{width:var(--sidebar);min-width:var(--sidebar);background:var(--primary);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.sb-logo{padding:22px 18px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.sb-logo h2{font-size:16px;font-weight:700;color:#fff}
.sb-logo p{font-size:11px;color:rgba(255,255,255,.45);margin-top:2px}
.sb-nav{flex:1;padding:10px 8px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:500;color:rgba(255,255,255,.65);transition:all .15s}
.sb-item:hover{background:rgba(255,255,255,.1);color:#fff}
.sb-item.active{background:rgba(255,255,255,.18);color:#fff;font-weight:600}
.sb-item svg{width:17px;height:17px;flex-shrink:0}
.sb-footer{padding:10px 8px;border-top:1px solid rgba(255,255,255,.1)}
.sb-role{padding:6px 12px;font-size:11px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.5px}
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{padding:20px 28px 0;display:flex;align-items:center;justify-content:space-between}
.topbar h1{font-size:23px;font-weight:800;letter-spacing:-.5px}
.topbar-actions{display:flex;gap:8px}
.content{padding:20px 28px 48px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 17px;border-radius:var(--r-sm);font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;border:none;transition:all .15s;white-space:nowrap}
.btn svg{width:15px;height:15px}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-h)}
.btn-accent{background:var(--accent);color:#fff}.btn-accent:hover{background:var(--accent-h)}
.btn-ghost{background:transparent;color:var(--text-m);border:1.5px solid var(--border)}.btn-ghost:hover{background:var(--surface2);color:var(--text)}
.btn-success{background:var(--green-l);color:var(--green)}.btn-success:hover{background:#a7f3d0}
.btn-danger{background:var(--red-l);color:var(--red)}.btn-danger:hover{background:#fca5a5}
.btn-warn{background:var(--warn-l);color:var(--warn)}.btn-warn:hover{background:#fde68a}
.btn-sm{padding:5px 12px;font-size:13px}
.btn-xs{padding:3px 9px;font-size:12px}
.btn-icon{padding:7px;border-radius:6px}

/* CARDS */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-title{font-size:15.5px;font-weight:700}
.stats-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:20px}
.stat-card{background:var(--surface);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}
.stat-label{font-size:11px;color:var(--text-m);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.stat-value{font-size:26px;font-weight:800;margin:4px 0 2px;letter-spacing:-1px}
.stat-sub{font-size:12px;color:var(--text-l)}
.stat-green .stat-value{color:var(--green)}
.stat-primary .stat-value{color:var(--primary)}
.stat-accent .stat-value{color:var(--accent)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

/* TABLES */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:600;color:var(--text-m);text-transform:uppercase;letter-spacing:.4px;padding:10px 12px;border-bottom:1.5px solid var(--border);background:var(--surface2)}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle;font-size:14px}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface2)}
.table-name{font-weight:600;font-size:15px}
.table-sub{font-size:12px;color:var(--text-m)}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600}
.badge-green{background:var(--green-l);color:var(--green)}
.badge-warn{background:var(--warn-l);color:var(--warn)}
.badge-red{background:var(--red-l);color:var(--red)}
.badge-blue{background:var(--blue-l);color:var(--blue)}
.badge-gray{background:var(--surface2);color:var(--text-m)}
.badge-accent{background:var(--accent-l);color:var(--accent-h)}

/* FORMS */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.form-grid-4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group.full{grid-column:1/-1}
label{font-size:12.5px;font-weight:600;color:var(--text-m)}
input,select,textarea{padding:8px 12px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-family:inherit;font-size:14px;color:var(--text);background:var(--surface);outline:none;transition:border .15s;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input[readonly]{background:var(--surface2);color:var(--text-m)}
textarea{resize:vertical;min-height:72px}
.age-hint{font-size:12px;color:var(--accent);font-weight:600;margin-top:2px}

/* OPTOMETRY TABLES */
.rx-table{width:100%;border-collapse:collapse;margin:4px 0;border:1px solid var(--border)}
.rx-table th{font-size:11.5px;font-weight:600;color:var(--text-m);text-align:center;padding:5px 3px;background:var(--surface2);border:1px solid var(--border)}
.rx-table td{border:1px solid var(--border);padding:3px}
.rx-table td:first-child{font-size:13px;font-weight:700;color:var(--text-m);text-align:center;padding:4px 8px;background:var(--surface2);width:40px}
.rx-table input{border:none;background:transparent;font-size:14px;text-align:center;width:100%;padding:4px 4px;min-width:52px}
.rx-table input:focus{background:var(--accent-l);border-radius:4px;outline:none}
.rx-section{margin-bottom:20px;border:1.5px solid var(--border);border-radius:8px;padding:12px 14px;background:#fafaf9}
.rx-section-title{font-size:13px;font-weight:700;color:var(--primary);margin-bottom:10px}
.rx-shared-row{display:flex;gap:14px;margin-top:10px;align-items:flex-end}
.rx-shared-row .form-group{flex:1}
.rx-shared-row label{font-size:11.5px}
.rx-shared-row input{font-size:14px;text-align:center}

/* TABS */
.tab-bar{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:18px;overflow-x:auto}
.tab{padding:9px 16px;font-size:13.5px;font-weight:600;color:var(--text-m);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab:hover{color:var(--text)}
.tab-content{display:none}.tab-content.active{display:block}

/* HISTORY */
.history-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.history-item:last-child{border-bottom:none}
.history-dot{width:10px;height:10px;border-radius:50%;background:var(--primary-l);border:2px solid var(--primary);margin-top:5px;flex-shrink:0}
.history-date{font-size:12.5px;color:var(--text-m);margin-bottom:2px}
.history-title{font-size:15px;font-weight:600}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto;backdrop-filter:blur(3px)}
.overlay.hidden{display:none}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:700px;box-shadow:var(--shadow-md);animation:slideUp .18s ease}
.modal-lg{max-width:860px}
.modal-xl{width:960px;max-width:96vw}
.modal-full{max-width:1100px}
.modal-header{padding:18px 24px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}
.modal-title{font-size:18px;font-weight:700}
.modal-body{padding:22px 24px;min-height:460px}
.exam-tab-wrap{min-height:380px}
.modal-footer{padding:14px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;background:var(--surface2);border-radius:0 0 14px 14px}
@keyframes slideUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}

/* MISC */
.chip{display:inline-block;background:var(--accent-l);color:var(--accent-h);font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:20px}
.salary-badge{display:inline-flex;align-items:center;gap:3px;background:#d1fae5;color:#065f46;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:20px}
.divider{height:1px;background:var(--border);margin:14px 0}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;color:var(--text-m);gap:8px}
.empty p{font-size:15px;font-weight:500}
.spinner{display:flex;align-items:center;justify-content:center;padding:48px;color:var(--text-m);font-size:15px}
.search-wrap{position:relative}.search-wrap input{padding-left:36px;width:270px}
.search-wrap::before{content:'🔍';position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:13px}
.filter-bar{display:flex;gap:6px;flex-wrap:wrap}
.filter-btn{padding:5px 14px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:transparent;color:var(--text-m);font-family:inherit}
.filter-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.mt-4{margin-top:4px}.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}
.mb-8{margin-bottom:8px}.mb-12{margin-bottom:12px}
.flex{display:flex}.gap-8{gap:8px}.gap-12{gap:12px}.items-center{align-items:center}.justify-between{justify-content:space-between}
.text-m{color:var(--text-m)}.text-sm{font-size:12.5px}.fw-6{font-weight:600}.fw-7{font-weight:700}
.money{font-weight:700;font-variant-numeric:tabular-nums}
.money-paid{color:var(--green)}.money-debt{color:var(--red)}
.patient-avatar{width:48px;height:48px;border-radius:50%;background:var(--primary-l);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(--primary);flex-shrink:0}
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.info-item label{display:block;font-size:11px;font-weight:600;color:var(--text-l);text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
.info-item p{font-size:14.5px;font-weight:500}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
.tg-info{background:var(--accent-l);border:1.5px solid #7dd3fc;border-radius:8px;padding:12px;font-size:13.5px;line-height:1.6;color:#0c4a6e}
.tg-info code{background:#bae6fd;padding:1px 5px;border-radius:4px;font-family:monospace}
.step-list{list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:6px}
.step-list li{counter-increment:s;display:flex;gap:8px;font-size:13.5px}
.step-list li::before{content:counter(s);width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}

/* CALENDAR */
.cal-week{overflow-x:auto;margin-top:8px}
.cal-table{border-collapse:collapse;min-width:100%}
.cal-table th{padding:8px 10px;font-size:12px;font-weight:700;color:var(--text-m);text-align:center;background:var(--surface2);border:1px solid var(--border);min-width:110px}
.cal-table th.today-col{background:var(--accent-l);color:var(--accent-h)}
.cal-table td{border:1px solid var(--border);padding:2px 4px;vertical-align:top;min-height:32px;min-width:110px}
.cal-time{width:52px;font-size:11.5px;font-weight:600;color:var(--text-l);text-align:right;padding-right:8px;white-space:nowrap;background:var(--surface2);border:1px solid var(--border)}
.cal-slot-free{background:#f0fdf4;cursor:pointer}.cal-slot-free:hover{background:#dcfce7}
.cal-slot-taken{background:#eff6ff}
.cal-slot-available{border-radius:4px;font-size:12px;padding:2px 6px;margin:1px;display:block;font-weight:600}
.cal-slot-available.free{background:#d1fae5;color:#065f46;cursor:pointer}.cal-slot-available.free:hover{background:#a7f3d0}
.cal-slot-available.booked{background:#dbeafe;color:#1e40af;cursor:pointer}
.cal-empty-cell{background:var(--surface);cursor:pointer}.cal-empty-cell:hover{background:var(--accent-l)}
.cal-nav{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.cal-nav h3{font-size:16px;font-weight:700;flex:1;text-align:center}

/* CORRECTION ITEM */
.corr-item{background:var(--surface2);border:1.5px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:10px}

/* PRINT */
@media print{
  body>*:not(#print-area){display:none!important}
  #print-area{display:block!important}
  @page{margin:14mm 16mm;size:A4}
}
#print-area{display:none}
.print-card{font-family:'Helvetica Neue',Arial,sans-serif;font-size:9pt;color:#1a1a2e;background:#fff;max-width:185mm;margin:0 auto;line-height:1.45}
.pc-bar{height:3.5pt;background:linear-gradient(to right,#1B4F72,#0891b2);margin-bottom:10pt;border-radius:2pt}
.pc-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8pt;padding-bottom:8pt;border-bottom:0.5pt solid #dde}
.pc-doctor{font-size:13pt;font-weight:700;color:#1B4F72;letter-spacing:-0.3pt}
.pc-doctor-sub{font-size:7.5pt;color:#888;margin-top:1pt}
.pc-meta{text-align:right;font-size:8pt;color:#555}
.pc-meta-num{font-size:10pt;font-weight:700;color:#1B4F72}
.pc-title{text-align:center;font-size:11pt;font-weight:700;text-transform:uppercase;letter-spacing:1pt;color:#1B4F72;margin:8pt 0 10pt;padding:6pt 0;border-top:0.5pt solid #dde;border-bottom:0.5pt solid #dde}
.pc-patient-block{background:#f0f5fb;border-radius:4pt;padding:6pt 8pt;margin-bottom:10pt}
.pc-patient-name{font-size:11pt;font-weight:700;color:#1a1a2e}
.pc-patient-sub{font-size:8pt;color:#555;margin-top:2pt}
.pc-sec{margin-bottom:8pt}
.pc-sec-label{font-size:7pt;font-weight:700;color:#0891b2;text-transform:uppercase;letter-spacing:0.8pt;margin-bottom:3pt}
.pc-text{font-size:8.5pt;padding:3pt 0;color:#333}
.pc-anam{background:#fafafa;border-left:2pt solid #0891b2;padding:5pt 8pt;font-size:8.5pt;white-space:pre-wrap;line-height:1.5}
.pc-table{width:100%;border-collapse:collapse;margin-bottom:2pt;font-size:8.5pt}
.pc-table th{text-align:center;padding:3pt 5pt;font-size:7pt;font-weight:700;color:#666;text-transform:uppercase;letter-spacing:0.4pt;border-bottom:1pt solid #c8d8e8;background:#f0f5fb}
.pc-table td{padding:3.5pt 5pt;text-align:center;border-bottom:0.5pt solid #e8eef4}
.pc-table .eye{font-weight:700;color:#1B4F72;text-align:left;width:22pt}
.pc-table .shared{vertical-align:middle;font-weight:600}
.pc-table .label-cell{text-align:left;color:#555;font-size:8pt;width:100pt}
.pc-rx-block{background:#f8fafe;border-radius:4pt;padding:6pt 8pt;margin-bottom:6pt}
.pc-rx-title{font-size:8pt;font-weight:700;color:#1B4F72;margin-bottom:4pt;text-transform:uppercase;letter-spacing:0.3pt}
.pc-recs{background:#f0fdf4;border-left:2.5pt solid #10b981;padding:6pt 8pt;font-size:8.5pt;white-space:pre-wrap;line-height:1.6;color:#1a2e1a}
.pc-footer{margin-top:10pt;padding-top:6pt;border-top:0.5pt solid #dde;display:flex;justify-content:space-between;align-items:flex-end}
.pc-note{font-size:6.5pt;color:#999;max-width:130mm}
.pc-control{font-size:8.5pt;font-weight:700;color:#1B4F72;text-align:right}

/* TOAST */
#toast{position:fixed;bottom:24px;right:24px;z-index:999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast-msg{padding:11px 18px;border-radius:9px;font-size:14px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.2);animation:slideUp .2s ease;pointer-events:auto}
/* Remove number spinners */
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
.discount-row{display:grid;grid-template-columns:1fr 80px 1fr;gap:8px;align-items:flex-end}
.discount-label{font-size:11px;color:var(--accent);font-weight:600;margin-top:2px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">👁</div>
    <h2>Гинтер Оптика</h2>
    <p>CRM система — введите PIN</p>
    <input type="password" id="pin-input" maxlength="8" placeholder="• • • •" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">Войти</button>
    <div id="login-err" class="login-err"></div>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <nav class="sidebar">
    <div class="sb-logo"><h2>👁 Гинтер Оптика</h2><p>CRM система</p></div>
    <div class="sb-nav">
      <div class="sb-item active" onclick="nav('dashboard')" id="nav-dashboard">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Главная
      </div>
      <div class="sb-item" onclick="nav('patients')" id="nav-patients">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Пациенты

// ═══ SLOTS (INTERACTIVE CALENDAR) ═══
let _slotDuration = 60; // minutes
let _slotBreak = 15;    // minutes

async function renderSlots() {
  document.getElementById('content').innerHTML=`<div class="topbar"><h1>Расписание</h1></div><div class="content"><div class="spinner">Загрузка...</div></div>`;
  const now=new Date();
  const day=now.getDay();
  const monday=new Date(now);
  monday.setDate(now.getDate()-(day===0?6:day-1)+_calWeekOffset*7);
  const weekDays=[];
  for(let i=0;i<7;i++){const d=new Date(monday);d.setDate(monday.getDate()+i);weekDays.push(d.toISOString().split('T')[0]);}
  const [{data:slots},{data:appts}]=await Promise.all([
    db.from('available_slots').select('*').in('date',weekDays).order('start_time'),
    db.from('appointments').select('date,time,type,patient_id,patients(name),id,appointment_number').in('date',weekDays).neq('status','отменён')
  ]);
  const slotMap={};
  (slots||[]).forEach(s=>{const k=`${s.date}|${s.start_time?.substr(0,5)}`;slotMap[k]=s;});
  const apptMap={};
  (appts||[]).forEach(a=>{const k=`${a.date}|${a.time?.substr(0,5)}`;apptMap[k]=a;});

  // Generate time grid based on duration
  const startH=8,endH=19;
  const step=15; // 15-min grid always shown
  const times=[];
  for(let m=startH*60;m<endH*60;m+=step){times.push(minToTime(m));}

  const todayStr=today();
  const monthLabel=`${MONTH_RU[monday.getMonth()]} ${monday.getFullYear()}`;

  const renderCell=(d,t)=>{
    const k=`${d}|${t}`;
    const appt=apptMap[k];
    const slot=slotMap[k];
    const isPast=d<todayStr||(d===todayStr&&t<new Date().toTimeString().substr(0,5));
    if(appt) return`<td style="background:#EFF6FF;padding:2px 4px;vertical-align:top">
      <div style="background:#DBEAFE;border-left:3px solid var(--accent);border-radius:3px;padding:2px 5px;font-size:11px;cursor:pointer" onclick="openPatientCard('${appt.patient_id}')">
        <div style="font-weight:700;color:var(--primary)">${appt.patients?.name?.split(' ')[0]||'—'}</div>
        <div style="color:var(--text-m);font-size:10px">${appt.appointment_number||appt.type?.split(' ')[0]||''}</div>
      </div></td>`;
    if(slot&&!slot.is_booked) return`<td style="background:#F0FDF4;padding:2px 4px;vertical-align:middle;cursor:pointer" onclick="${isAdmin()?`removeSlot('${slot.id}')`:''}" title="Кликни чтобы убрать">
      <div style="display:flex;align-items:center;justify-content:center;height:28px;color:var(--green);font-size:11px;font-weight:600">✓</div></td>`;
    if(isPast) return`<td style="background:#F8F7F5;"></td>`;
    return`<td style="background:white;cursor:${isAdmin()?'pointer':'default'};border:1px solid transparent" 
      ${isAdmin()?`onclick="addSlotAt('${d}','${t}')" onmouseenter="this.style.background='#F0FDF4'" onmouseleave="this.style.background='white'" title="Добавить слот ${t}"`:''}></td>`;
  };

  document.querySelector('.content').innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
      <div class="flex gap-8 items-center">
        <button class="btn btn-ghost btn-sm" onclick="_calWeekOffset--;renderSlots()">← Назад</button>
        <b style="font-size:15px;min-width:160px;text-align:center">${monthLabel}</b>
        <button class="btn btn-ghost btn-sm" onclick="_calWeekOffset=0;renderSlots()">Сегодня</button>
        <button class="btn btn-ghost btn-sm" onclick="_calWeekOffset++;renderSlots()">Вперёд →</button>
      </div>
      ${isAdmin()?`<div class="flex gap-8 items-center">
        <div class="flex gap-8 items-center" style="background:var(--surface2);border-radius:8px;padding:6px 12px">
          <span style="font-size:12.5px;color:var(--text-m)">Длительность:</span>
          <select style="font-size:13px;border:none;background:transparent;font-weight:600;cursor:pointer" onchange="_slotDuration=+this.value">
            ${[15,30,45,60,90].map(m=>`<option value="${m}" ${_slotDuration===m?'selected':''}>${m} мин.</option>`).join('')}
          </select>
          <span style="font-size:12.5px;color:var(--text-m)">Перерыв:</span>
          <select style="font-size:13px;border:none;background:transparent;font-weight:600;cursor:pointer" onchange="_slotBreak=+this.value">
            ${[0,5,10,15,20,30].map(m=>`<option value="${m}" ${_slotBreak===m?'selected':''}>${m} мин.</option>`).join('')}
          </select>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="clearDaySlots()">Очистить день</button>
      </div>`:''}
    </div>
    <div style="background:white;border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden">
      <div style="display:flex;font-size:11.5px">
        <div style="width:52px;flex-shrink:0"></div>
        ${weekDays.map(d=>{const dt=new Date(d+'T12:00:00');const isToday=d===todayStr;return`<div style="flex:1;text-align:center;padding:8px 4px;font-weight:700;background:${isToday?'var(--accent-l)':'var(--surface2)'};color:${isToday?'var(--accent-h)':'var(--text-m)'};border-bottom:1.5px solid var(--border)">
          ${DOW[dt.getDay()]} <span style="font-size:16px;color:${isToday?'var(--accent)':'var(--text)'}">${dt.getDate()}</span>
        </div>`;}).join('')}
      </div>
      <div style="overflow-y:auto;max-height:calc(100vh - 260px)">
        <table style="width:100%;border-collapse:collapse;table-layout:fixed">
          <colgroup><col style="width:52px">${weekDays.map(()=>`<col>`).join('')}</colgroup>
          <tbody>${times.map((t,idx)=>{
            const isHour=t.endsWith(':00');
            return`<tr style="height:${isHour?'32px':'26px'}">
              <td style="font-size:${isHour?'11.5':'9'}px;font-weight:${isHour?'600':'400'};color:var(--text-l);text-align:right;padding-right:8px;vertical-align:top;padding-top:2px;border-right:1px solid var(--border);${isHour?'':'opacity:.5'}">${isHour?t:''}</td>
              ${weekDays.map(d=>renderCell(d,t)).join('')}
            </tr>`;
          }).join('')}
          </tbody>
        </table>
      </div>
    </div>
    <div style="display:flex;gap:12px;margin-top:10px;font-size:12px;color:var(--text-m);align-items:center">
      <span style="display:flex;align-items:center;gap:4px"><span style="display:inline-block;width:14px;height:14px;background:#F0FDF4;border-radius:3px;border:1px solid var(--green)"></span> Свободный слот (кликни чтобы убрать)</span>
      <span style="display:flex;align-items:center;gap:4px"><span style="display:inline-block;width:14px;height:14px;background:#DBEAFE;border-radius:3px"></span> Занято пациентом</span>
      ${isAdmin()?`<span style="display:flex;align-items:center;gap:4px"><span style="display:inline-block;width:14px;height:14px;background:white;border-radius:3px;border:1px solid var(--border)"></span> Кликни чтобы добавить слот</span>`:''}
    </div>`;
}

async function addSlotAt(date,time){
  await db.from('available_slots').upsert({date,start_time:time,is_booked:false},{onConflict:'date,start_time'});
  renderSlots();
}
async function removeSlot(id){
  if(!confirm('Убрать этот слот?'))return;
  await db.from('available_slots').delete().eq('id',id);
  renderSlots();
}
async function delSlot(id){ await removeSlot(id); }
async function clearDaySlots(){
  const day=prompt('Введите дату для очистки (ГГГГ-ММ-ДД):');
  if(!day)return;
  await db.from('available_slots').delete().eq('date',day).eq('is_booked',false);
  toast('Слоты очищены');renderSlots();
}

async function loadTgUpdates(){
  document.getElementById('tg-updates').innerHTML='Загрузка...';
  const token=await getBotToken();if(!token){document.getElementById('tg-updates').innerHTML='<span style="color:var(--red)">Нет токена</span>';return;}
  const r=await fetch(`https://api.telegram.org/bot${token}/getUpdates`);const data=await r.json();
  if(!data.ok||!data.result?.length){document.getElementById('tg-updates').innerHTML='Нет сообщений — попросите пациента написать /start';return;}
  const seen=new Set();
  const rows=data.result.reverse().filter(m=>{const id=m.message?.from?.id;if(seen.has(id))return false;seen.add(id);return true;}).map(m=>{
    const f=m.message?.from||{};

async function saveAppt(id){
  const patient_id=v('a-pid'),date=v('a-date'),time=v('a-time');
  if(!patient_id||!date||!time){alert('Заполните обязательные поля');return;}
  const typeName=v('a-type');
  const dur=+(v('a-dur'))||60;
  const data={patient_id,date,time,type:typeName,notes:v('a-notes'),consultation_price:+(v('a-price'))||0};
  let apptId=id;
  if(id){await db.from('appointments').update(data).eq('id',id);toast('Приём обновлён');}
  else{
    const apptNum=await generateApptNumber(date);
    const{data:a}=await db.from('appointments').insert({...data,status:'запланирован',appointment_number:apptNum}).select().single();
    apptId=a?.id;
    toast(`Приём записан · ${apptNum}`);
  }
  // Block slots by duration
  if(!id&&apptId){await blockSlotsByDuration(date,time,dur,apptId);}
  // Notify
  if(v('a-notify')==='yes'&&!id){
    const{data:p}=await db.from('patients').select('name,telegram_chat_id').eq('id',patient_id).single();
    if(p?.telegram_chat_id){
      const msg=`Здравствуйте, ${p.name}!\n\nВы записаны в Оптику Ginter на ${typeName} к оптометристу Анне Новосёловой.\n\n📅 ${fmtDateLong(date)}\n⏰ ${time}\n\nАдрес: <a href="https://maps.app.goo.gl/LJerB2rskqhnhES48">Trg Republike, 25 (Рибља пијаца, там, где проходит Ночной Базар)</a> 📍\n\nПродолжительность приёма — ${apptDurText(typeName)}\n\n💰 Стоимость приёма: ${(+(v('a-price')||v('sb-price')||3000)).toLocaleString('ru-RU')} динар. Оплата за приём — только наличными.\n(Очки можно оплатить картой)\n\nНа приём принесите, пожалуйста, все рецепты, обследования и очки с диоптриями, которые у вас есть (даже старые и которые вы уже не используете).\n\nЗа полчаса до приёма нужно прекратить активную зрительную нагрузку — перестать работать за компьютером, телефоном и дать глазам отдохнуть.\n\nЕсли вы носите контактные линзы, то за 20 минут до приёма вам нужно их снять, чтобы глаза отдохнули. Вы можете взять с собой контейнер и жидкость, снять КЛ в оптике, а после приёма надеть. (В таком случае, вам надо прийти в оптику за 20 минут до назначенного времени).\n\n❤️‍🩹 Если ваши планы изменятся или вы захотите отменить или перенести приём — сообщите, пожалуйста, заранее.\n\nЕсли у вас есть ещё вопросы — свободно пишите, обсудим.\n\nДо встречи!\nАнна.`;
      await tgSend(p.telegram_chat_id,msg);
    }
  }
  closeModal();render();
}
async function blockSlotsByDuration(date,startTime,durationMin,appointmentId){
  const{data:slots}=await db.from('available_slots').select('*').eq('date',date).order('start_time');
  if(!slots)return;
  const startMin=timeToMin(startTime);const endMin=startMin+durationMin;
  const toBlock=slots.filter(s=>{ const sm=timeToMin(s.start_time?.substr(0,5));return sm>=startMin&&sm<endMin; });
  for(const sl of toBlock) await db.from('available_slots').update({is_booked:true,appointment_id:appointmentId}).eq('id',sl.id);
}

async function cancelAppt(id){
  if(!confirm('Отменить приём?'))return;
  await db.from('appointments').update({status:'отменён'}).eq('id',id);
  await db.from('available_slots').update({is_booked:false,appointment_id:null}).eq('appointment_id',id);
  toast('Приём отменён');
  render();
  if(_openPatientId) _renderPatientCard(_openPatientId);
}

async function saveExam(id,apptId,patientId,visitNum){
  const data={
    appointment_id:apptId||null,patient_id:patientId,visit_number:+visitNum,
    visit_reason:[...document.querySelectorAll('input[name="visit_reason"]:checked')].map(cb=>cb.value).join(', '),complaints_notes:v('e-complaints'),last_ophthalmologist:v('e-lastoph'),
    eye_diseases_notes:v('e-eyedis'),general_diseases_notes:v('e-gendis'),
    current_corrections:_examData.corrections,
    refr_od_sph:v('r-od-sph'),refr_od_cyl:v('r-od-cyl'),refr_od_ax:v('r-od-ax'),refr_od_pd:v('r-pd'),refr_od_ave:v('r-od-ave'),
    refr_os_sph:v('r-os-sph'),refr_os_cyl:v('r-os-cyl'),refr_os_ax:v('r-os-ax'),refr_os_pd:v('r-pd'),refr_os_ave:v('r-os-ave'),
    exam_od_without:v('x-od-wo'),exam_od_cosph:v('x-od-cs'),exam_od_cyl:v('x-od-cyl'),exam_od_ax:v('x-od-ax'),exam_od_with:v('x-od-wi'),
    exam_os_without:v('x-os-wo'),exam_os_cosph:v('x-os-cs'),exam_os_cyl:v('x-os-cyl'),exam_os_ax:v('x-os-ax'),exam_os_with:v('x-os-wi'),
    exam_ou:v('x-ou'),
    rx_far_enabled:true,rx_far_od_sph:v('rf-od-sph'),rx_far_od_cyl:v('rf-od-cyl'),rx_far_od_ax:v('rf-od-ax'),rx_far_od_pd:v('rf-pd'),
    rx_far_os_sph:v('rf-os-sph'),rx_far_os_cyl:v('rf-os-cyl'),rx_far_os_ax:v('rf-os-ax'),rx_far_os_pd:v('rf-add'),
    rx_comp_enabled:true,rx_comp_od_sph:v('rc-od-sph'),rx_comp_od_cyl:v('rc-od-cyl'),rx_comp_od_ax:v('rc-od-ax'),rx_comp_od_pd:v('rc-pd'),rx_comp_od_add:v('rc-add'),
    rx_comp_os_sph:v('rc-os-sph'),rx_comp_os_cyl:v('rc-os-cyl'),rx_comp_os_ax:v('rc-os-ax'),
    rx_near_enabled:true,rx_near_od_sph:v('rn-od-sph'),rx_near_od_cyl:v('rn-od-cyl'),rx_near_od_ax:v('rn-od-ax'),rx_near_od_pd:v('rn-pd'),rx_near_od_add:v('rn-degr'),
    rx_near_os_sph:v('rn-os-sph'),rx_near_os_cyl:v('rn-os-cyl'),rx_near_os_ax:v('rn-os-ax'),
    rx_cl_enabled:true,rx_cl_od_sph:v('rcl-od-sph'),rx_cl_od_cyl:v('rcl-od-cyl'),rx_cl_od_ax:v('rcl-od-ax'),rx_cl_od_bc:v('rcl-bc'),rx_cl_od_dia:v('rcl-dia'),rx_cl_od_type:v('rcl-type'),
    rx_cl_os_sph:v('rcl-os-sph'),rx_cl_os_cyl:v('rcl-os-cyl'),rx_cl_os_ax:v('rcl-os-ax'),
    recommendations:v('e-recs'),control_date:v('e-ctrl-date')||null
  };
  if(id){await db.from('examinations').update(data).eq('id',id);toast('Карта сохранена ✓');}
  else{const{data:ne}=await db.from('examinations').insert(data).select().single();if(ne?.id)window._lastExamId=ne.id;toast('Карта создана ✓');}
  _modalDirty=false;
  return window._lastExamId||id;
}

}

async function printExam(examId){
  await _buildPrintCard(examId);
  setTimeout(()=>window.print(),300);
}

async function emailExam(examId,target){
  toast('Генерируем PDF...','info');
  const{e,p}=await _buildPrintCard(examId);
  const{data:sRows}=await db.from('settings').select('key,value').in('key',['doctor_name']);
  const s={}; (sRows||[]).forEach(r=>s[r.key]=r.value);
  const date=fmt((e?.created_at||today()).split('T')[0]);
  const filename=`karta-${(p?.name||'pacient').split(' ')[0]}-${date}.pdf`;
  const element=document.getElementById('print-area');
  try {
    await html2pdf().set({margin:12,filename,image:{type:'jpeg',quality:0.98},html2canvas:{scale:2},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}}).from(element).save();
  } catch(err){ console.error('PDF error',err); }
  let toEmail = target==='clinic' ? 'optikaginter@yahoo.com' : (p?.email||'');
  if(target==='patient'&&!toEmail){ toast('Email пациента не указан','error'); return; }
  const subj=`Карта обследования — ${p?.name||''} — ${date}`;
  const body=`Здравствуйте!\n\nПрикрепляю карту оптометрического обследования пациента ${p?.name||''}.\nДата приёма: ${date}, Визит №${e?.visit_number||1}\n\nС уважением,\n${s.doctor_name||'Анна Новосёлова'}`;
  toast('PDF скачан — прикрепите к письму','info');
  setTimeout(()=>{ window.location.href=`mailto:${toEmail}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`; },1200);
}

// ═══ APPOINTMENT NUMBER ═══
async function generateApptNumber(date){
  const[year,,month]=[date.substr(0,4),'-',date.substr(5,2)];
  const mon=date.substr(5,2); const yr=date.substr(2,2);
  const prefix=`OG-${mon}${yr}`;
  const{count}=await db.from('appointments').select('id',{count:'exact',head:true}).like('appointment_number',`${prefix}-%`);
  return`${prefix}-${String((count||0)+1).padStart(2,'0')}`;
}

  ]);

function _rxOpts(exams,selVal){
  const opts=['<option value="">— без рецепта —</option>'];
  (exams||[]).forEach(e=>{
    const d=fmt(e.created_at?.split('T')[0]);
    if(e.rx_far_od_sph)opts.push(`<option value="${e.id}|far" ${selVal===e.id+'|far'?'selected':''}>Визит №${e.visit_number||'?'} (${d}) — Даль</option>`);
    if(e.rx_comp_od_sph)opts.push(`<option value="${e.id}|comp" ${selVal===e.id+'|comp'?'selected':''}>Визит №${e.visit_number||'?'} (${d}) — Компьютер</option>`);
    if(e.rx_near_od_sph)opts.push(`<option value="${e.id}|near" ${selVal===e.id+'|near'?'selected':''}>Визит №${e.visit_number||'?'} (${d}) — Близь</option>`);
    if(e.rx_cl_od_sph)opts.push(`<option value="${e.id}|cl" ${selVal===e.id+'|cl'?'selected':''}>Визит №${e.visit_number||'?'} (${d}) — МКЛ</option>`);
  });
  return opts.join('');
}

  const type=document.getElementById('qrx-type')?.value;

  const clWrap=document.getElementById('qrx-cl-type-wrap');

async function saveQuickRx(){
  const pid=v('o-pid'); if(!pid){alert('Сначала выберите пациента');return;}
  const type=document.getElementById('qrx-type')?.value||'far';
  const isOwn=document.getElementById('qrx-own')?.checked;
  const{count}=await db.from('examinations').select('id',{count:'exact',head:true}).eq('patient_id',pid);
  const visitNum=(count||0)+1;
  const note=(isOwn?'Свой рецепт. ':'')+v('qrx-note');
  const rxData={
    patient_id:pid, visit_number:visitNum,
    recommendations: note||null,
    rx_far_enabled: type==='far',
    rx_comp_enabled: type==='comp',
    rx_near_enabled: type==='near',
    rx_cl_enabled: type==='cl',
  };
  if(type==='far'||type==='comp'){
    const pre=type==='far'?'rx_far':'rx_comp';
    rxData[pre+'_od_sph']=v('qrx-od-sph'); rxData[pre+'_od_cyl']=v('qrx-od-cyl'); rxData[pre+'_od_ax']=v('qrx-od-ax');
    rxData[pre+'_os_sph']=v('qrx-os-sph'); rxData[pre+'_os_cyl']=v('qrx-os-cyl'); rxData[pre+'_os_ax']=v('qrx-os-ax');
    rxData[pre+'_od_pd']=v('qrx-pd');
    // ADD: far uses rx_far_os_pd (schema naming), comp uses rx_comp_od_add
    if(type==='far') rxData.rx_far_os_pd=v('qrx-add');
    else rxData.rx_comp_od_add=v('qrx-add');
  } else if(type==='near'){
    rxData.rx_near_od_sph=v('qrx-od-sph'); rxData.rx_near_od_cyl=v('qrx-od-cyl'); rxData.rx_near_od_ax=v('qrx-od-ax');
    rxData.rx_near_os_sph=v('qrx-os-sph'); rxData.rx_near_os_cyl=v('qrx-os-cyl'); rxData.rx_near_os_ax=v('qrx-os-ax');
    rxData.rx_near_od_pd=v('qrx-pd'); rxData.rx_near_od_add=v('qrx-add');
  } else if(type==='cl'){
    rxData.rx_cl_od_sph=v('qrx-od-sph'); rxData.rx_cl_od_cyl=v('qrx-od-cyl'); rxData.rx_cl_od_ax=v('qrx-od-ax');
    rxData.rx_cl_os_sph=v('qrx-os-sph'); rxData.rx_cl_os_cyl=v('qrx-os-cyl'); rxData.rx_cl_os_ax=v('qrx-os-ax');
    rxData.rx_cl_od_bc=v('qrx-pd'); rxData.rx_cl_od_dia=v('qrx-add'); rxData.rx_cl_od_type=v('qrx-cl-type');
  }
  const{data:ne}=await db.from('examinations').insert(rxData).select().single();
  if(!ne){toast('Ошибка сохранения рецепта','error');return;}
  // Add to prescription dropdown and select
  const typeLabels={far:'Даль',comp:'Компьютер',near:'Близь',cl:'МКЛ'};
  const sel=document.getElementById('o-rx');
  const opt=document.createElement('option');
  const val=`${ne.id}|${type}`;
  opt.value=val; opt.textContent=`Визит №${visitNum} (${fmt(today())}) — ${typeLabels[type]}${isOwn?' [свой рецепт]':''}`; opt.selected=true;
  sel.appendChild(opt); sel.value=val;
  toggleQuickRx();
  toast('Рецепт сохранён ✓');
  await showRxPreview(val);
}

async function showRxPreview(val){
  const prev=document.getElementById('o-rx-preview');
  if(!val){prev.style.display='none';return;}
  const[examId,type]=val.split('|');
  const{data:e}=await db.from('examinations').select('*').eq('id',examId).single();
  if(!e){prev.style.display='none';return;}
  const fieldMap={far:['rx_far_od_sph','rx_far_od_cyl','rx_far_od_ax','rx_far_od_pd','rx_far_os_sph','rx_far_os_cyl','rx_far_os_ax'],comp:['rx_comp_od_sph','rx_comp_od_cyl','rx_comp_od_ax','rx_comp_od_pd','rx_comp_os_sph','rx_comp_os_cyl','rx_comp_os_ax'],near:['rx_near_od_sph','rx_near_od_cyl','rx_near_od_ax','rx_near_od_pd','rx_near_os_sph','rx_near_os_cyl','rx_near_os_ax']};
  if(type==='cl'){prev.innerHTML=`<b>МКЛ:</b> OD: ${e.rx_cl_od_sph||'—'} / ${e.rx_cl_od_cyl||''} ax${e.rx_cl_od_ax||''} BC${e.rx_cl_od_bc||''} DIA${e.rx_cl_od_dia||''}<br>OS: ${e.rx_cl_os_sph||'—'} / ${e.rx_cl_os_cyl||''} ax${e.rx_cl_os_ax||''} · ${e.rx_cl_od_type||''}`;prev.style.display='block';return;}
  const f=fieldMap[type];if(!f){prev.style.display='none';return;}
  prev.innerHTML=`OD: <b>${e[f[0]]||'—'}</b> / ${e[f[1]]||''} ax${e[f[2]]||''} PD${e[f[3]]||''}<br>OS: <b>${e[f[4]]||'—'}</b> / ${e[f[5]]||''} ax${e[f[6]]||''}`;
  prev.style.display='block';
}
function recalcOrder(){
  const fBase=+document.getElementById('o-fprice')?.value||0;
  const fDisc=Math.min(Math.max(+document.getElementById('o-fdisc')?.value||0,0),100);
  const fFinal=Math.round(fBase*(1-fDisc/100));
  if(document.getElementById('o-fprice-final')) document.getElementById('o-fprice-final').value=fFinal;

  const lBase=+document.getElementById('o-lprice')?.value||0;
  const lDisc=Math.min(Math.max(+document.getElementById('o-ldisc')?.value||0,0),100);
  const lPer=Math.round(lBase*(1-lDisc/100));
  const lFinal=lPer*2; // × 2 линзы
  if(document.getElementById('o-lprice-final')) document.getElementById('o-lprice-final').value=lFinal;

  const work=+document.getElementById('o-wprice')?.value||0;
  const prepay=+document.getElementById('o-prepay')?.value||0;
  const total=fFinal+lFinal+work;
  const balance=Math.max(total-prepay,0);
  if(document.getElementById('o-total-display')) document.getElementById('o-total-display').textContent=total.toLocaleString('ru-RU')+' дин.';
  if(document.getElementById('o-balance-display')) document.getElementById('o-balance-display').textContent='Доплата: '+balance.toLocaleString('ru-RU')+' дин.';
}

async function saveOrder(id){
  const patient_id=v('o-pid'); if(!patient_id){alert('Выберите пациента');return;}
  const rxSel=document.getElementById('o-rx')?.value||'';
  const[examId,rxType]=rxSel.split('|');
  const rxLabels={far:'Даль',comp:'Компьютер',near:'Близь',cl:'МКЛ'};
  const fFinal=Math.max(+(document.getElementById('o-fprice-final')?.value||v('o-fprice'))||0,0);
  // lens_price saved as per-piece (÷2 from the "за пару" display)
  const lPairFinal=Math.max(+(document.getElementById('o-lprice-final')?.value)||0,0);
  const lPerPiece=Math.round(lPairFinal/2);
  const data={patient_id,type:v('o-type'),prescription_label:rxType?rxLabels[rxType]:null,examination_id:examId||null,
    frame_code:v('o-fcode'), frame_price:fFinal,
    lens_name:v('o-lname'), lens_price:lPerPiece,
    work_price:v('o-wprice')?Math.max(+v('o-wprice'),0):null,
    prepayment:Math.max(+v('o-prepay')||0,0),
    promised_date:v('o-pdate')||null,
    notes:v('o-notes')};
  if(id){const st=v('o-status');await db.from('orders').update({...data,status:st}).eq('id',id);toast('Заказ обновлён');}
  else{await db.from('orders').insert({...data,status:'оформлен'});toast('Заказ оформлен');}
  await recalcSalary(patient_id);
  closeModal();render();
}

  toast(ok?'📨 Опрос отправлен':'Ошибка',ok?'success':'error');
}
async function delOrder(id){if(!confirm('Удалить заказ?'))return;await db.from('orders').delete().eq('id',id);render();}

// ═══ SLOTS ═══
async function addSlotAt(date,time){
  if(!confirm(`Добавить слот ${time} на ${fmt(date)}?`))return;
  await db.from('available_slots').upsert({date,start_time:time,is_booked:false},{onConflict:'date,start_time'});
  renderSlots();
}
async function delSlot(id){await db.from('available_slots').delete().eq('id',id);renderSlots();}
async function openAddSlots(){
  openModal(`<div class="modal">
    <div class="modal-header"><span class="modal-title">Добавить слоты</span><button class="btn btn-ghost btn-sm" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group"><label>С даты</label><input type="date" id="sl-from" value="${today()}"></div>
        <div class="form-group"><label>По дату</label><input type="date" id="sl-to" value="${today()}"></div>
        <div class="form-group full"><label>Время (через запятую)</label><input id="sl-times" value="09:00,10:00,11:00,12:00,14:00,15:00,16:00"></div>
        <div class="form-group full"><label>Дни недели</label>
          <div class="flex gap-8" style="flex-wrap:wrap;margin-top:4px">
            ${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map((d,i)=>`<label style="display:flex;align-items:center;gap:4px;font-size:14px;cursor:pointer"><input type="checkbox" id="sl-d${i}" ${i<5?'checked':''} style="width:auto">${d}</label>`).join('')}
          </div>
        </div>
      </div>
    </div>
    <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">Отмена</button><button class="btn btn-accent" onclick="bulkAddSlots()">Добавить</button></div>
  </div>`);
}
async function bulkAddSlots(){
  const from=new Date(v('sl-from')),to=new Date(v('sl-to'));
  const times=v('sl-times').split(',').map(t=>t.trim()).filter(Boolean);
  const days=[0,1,2,3,4,5,6].filter(i=>checked('sl-d'+i)).map(i=>i===6?0:i+1);
  const slots=[];
  for(let d=new Date(from);d<=to;d.setDate(d.getDate()+1)){
    if(days.includes(d.getDay())){
      const ds=d.toISOString().split('T')[0];
      times.forEach(t=>slots.push({date:ds,start_time:t,is_booked:false}));
    }
  }
  if(!slots.length){toast('Нет слотов','error');return;}
  await db.from('available_slots').upsert(slots,{onConflict:'date,start_time'});
  toast(`Добавлено ${slots.length} слотов`);closeModal();renderSlots();
}

// ═══ EXPORT ═══
async function exportAll(){
  const[{data:pa},{data:ap},{data:ex},{data:or}]=await Promise.all([db.from('patients').select('*'),db.from('appointments').select('*'),db.from('examinations').select('*'),db.from('orders').select('*')]);
  const blob=new Blob([JSON.stringify({patients:pa,appointments:ap,examinations:ex,orders:or,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`crm-backup-${today()}.json`;a.click();toast('Экспорт готов');
}
