<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Нюсик учит математику</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&display=swap');
  :root {
    --cream:#FFF8F0;--warm:#FFF0DC;--grey-light:#E8E4E0;--grey:#B0A8A0;
    --grey-dark:#6B6360;--cheese:#F5C842;--cheese-dark:#E0A800;
    --green:#5CC87A;--green-dark:#3DA85C;--red:#FF6B6B;
    --purple:#9B7FD4;--blue:#5BA4CF;--text:#3A3330;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Nunito',sans-serif;background:var(--cream);min-height:100vh;
    display:flex;flex-direction:column;align-items:center;padding:12px 12px 32px;color:var(--text);}
  .header{text-align:center;margin-bottom:10px;position:relative;width:100%;max-width:480px;}
  .header h1{font-size:1.7rem;font-weight:900;color:var(--grey-dark);}
  .header h1 span{color:var(--cheese-dark);}
  .sound-btn{position:absolute;right:0;top:50%;transform:translateY(-50%);
    background:white;border:2px solid var(--grey-light);border-radius:12px;
    font-size:1.3rem;width:44px;height:44px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:all .15s;}
  .sound-btn:hover{background:var(--grey-light);}
  .sound-btn.muted{opacity:.45;}
  .bubble-wrap{margin-bottom:12px;}
  .bubble{background:var(--grey-light);border-radius:18px 18px 18px 4px;
    padding:12px 18px;font-size:1.1rem;font-weight:700;color:var(--grey-dark);
    max-width:300px;text-align:center;line-height:1.45;min-height:58px;
    display:flex;align-items:center;justify-content:center;transition:background .3s,color .3s;}
  .bubble.happy-bubble{background:#D4F5DC;color:#2A7A40;}
  .bubble.sad-bubble{background:#FFE5E5;color:#B03030;}
  .speaking-dots{display:none;justify-content:center;gap:4px;margin-top:5px;}
  .speaking-dots.active{display:flex;}
  .speaking-dots span{width:7px;height:7px;background:var(--purple);border-radius:50%;
    animation:dotBounce .7s ease infinite;}
  .speaking-dots span:nth-child(2){animation-delay:.15s;}
  .speaking-dots span:nth-child(3){animation-delay:.3s;}
  @keyframes dotBounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
  .level-bar,.op-bar{display:flex;gap:6px;width:100%;max-width:480px;margin-bottom:10px;}
  .level-btn{flex:1;padding:7px 2px;border:2px solid var(--grey-light);border-radius:12px;
    background:white;font-family:'Nunito',sans-serif;font-size:.72rem;font-weight:800;
    color:var(--grey-dark);cursor:pointer;transition:all .15s;line-height:1.3;text-align:center;}
  .level-btn.active{background:var(--purple);border-color:var(--purple);color:white;}
  .level-btn:hover:not(.active){background:var(--grey-light);}
  .op-btn{flex:1;padding:7px 0;border:2px solid var(--grey-light);border-radius:12px;
    background:white;font-family:'Nunito',sans-serif;font-size:.8rem;font-weight:800;
    color:var(--grey-dark);cursor:pointer;transition:all .15s;}
  .op-btn.active{background:var(--blue);border-color:var(--blue);color:white;}
  .op-btn:hover:not(.active){background:var(--grey-light);}
  .cheese-store{background:var(--warm);border:3px solid var(--cheese);border-radius:18px;
    padding:8px 16px;margin-bottom:10px;text-align:center;width:100%;max-width:480px;}
  .cheese-store-label{font-size:.75rem;font-weight:800;color:var(--grey-dark);
    text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;}
  .cheese-row{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;min-height:26px;}
  .cheese-piece{font-size:1.3rem;animation:popIn .3s cubic-bezier(.36,.07,.19,.97);}
  @keyframes popIn{0%{transform:scale(0) rotate(-20deg);opacity:0;}
    70%{transform:scale(1.3) rotate(5deg);}100%{transform:scale(1) rotate(0);opacity:1;}}
  .card{background:white;border-radius:28px;padding:20px 16px;width:100%;max-width:480px;
    box-shadow:0 4px 24px rgba(0,0,0,.07);}
  .mouse-area{display:flex;flex-direction:column;align-items:center;margin-bottom:16px;}
  .mouse-svg{width:130px;height:130px;}
  @keyframes wiggle{0%,100%{transform:rotate(0);}25%{transform:rotate(-8deg) scale(1.05);}75%{transform:rotate(8deg) scale(1.05);}}
  @keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-6px);}40%{transform:translateX(6px);}60%{transform:translateX(-4px);}80%{transform:translateX(4px);}}
  @keyframes bop{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
  @keyframes mousePulse{from{transform:scale(1);}to{transform:scale(1.08) rotate(2deg);}}
  .mouse-svg[data-mood="happy"]{animation:wiggle .5s ease;}
  .mouse-svg[data-mood="sad"]{animation:shake .4s ease;}
  .mouse-svg[data-mood="thinking"]{animation:bop 1.2s ease infinite;}
  .mouse-svg[data-mood="speaking"]{animation:mousePulse .4s ease infinite alternate;}
  .task-area{text-align:center;margin-bottom:14px;}
  .task-label{font-size:.78rem;font-weight:800;color:var(--grey);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px;}
  .level-badge{display:inline-block;background:var(--purple);color:white;font-size:.7rem;
    font-weight:800;border-radius:8px;padding:2px 8px;margin-left:6px;vertical-align:middle;}
  .task-expression{font-size:3rem;font-weight:900;color:var(--text);letter-spacing:-1px;
    min-height:58px;display:flex;align-items:center;justify-content:center;gap:8px;
    cursor:pointer;border-radius:12px;transition:background .15s;padding:4px 8px;}
  .task-expression:hover{background:var(--grey-light);}
  .task-expression .op{color:var(--purple);}
  .task-expression .eq{color:var(--grey);}
  .hint{font-size:.82rem;color:var(--blue);font-weight:700;margin-top:4px;min-height:20px;}
  .read-task-btn{background:none;border:2px dashed var(--grey-light);border-radius:10px;
    color:var(--grey);font-family:'Nunito',sans-serif;font-size:.78rem;font-weight:700;
    padding:4px 12px;cursor:pointer;margin-top:6px;transition:all .15s;}
  .read-task-btn:hover{border-color:var(--purple);color:var(--purple);background:#F3EEFF;}
  .answers-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .answer-btn{background:var(--warm);border:3px solid var(--cheese);border-radius:16px;
    font-family:'Nunito',sans-serif;font-size:1.7rem;font-weight:900;color:var(--text);
    cursor:pointer;padding:14px 0;transition:all .15s;-webkit-tap-highlight-color:transparent;}
  .answer-btn:hover:not(:disabled){background:var(--cheese);transform:scale(1.04);}
  .answer-btn:active:not(:disabled){transform:scale(.97);}
  .answer-btn.correct{background:var(--green);border-color:var(--green-dark);color:white;animation:popIn .3s;}
  .answer-btn.wrong{background:var(--red);border-color:#C04040;color:white;animation:shake .4s;}
  .next-btn{display:block;width:100%;border:none;border-radius:16px;
    font-family:'Nunito',sans-serif;font-size:1.1rem;font-weight:900;
    cursor:pointer;padding:14px 0;margin-bottom:14px;transition:background .2s,color .2s;}
  .next-btn:disabled{background:var(--grey-light);color:var(--grey);cursor:default;}
  .next-btn:not(:disabled){background:var(--green);color:white;}
  .next-btn:not(:disabled):hover{background:var(--green-dark);}
  .progress-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .progress-bar-bg{flex:1;height:10px;background:var(--grey-light);border-radius:8px;overflow:hidden;}
  .progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--cheese),var(--green));
    border-radius:8px;transition:width .4s ease;}
  .progress-text{font-size:.8rem;font-weight:800;color:var(--grey);min-width:36px;text-align:right;}
  .score-row{display:flex;gap:16px;justify-content:center;font-size:.85rem;font-weight:700;color:var(--grey);}
  .correct-count{color:var(--green-dark);}.wrong-count{color:var(--red);}
  .win-overlay{display:none;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:8px 0;}
  .win-overlay.visible{display:flex;animation:popIn .5s;}
  .win-stars{font-size:2.5rem;letter-spacing:4px;}
  .win-title{font-size:1.5rem;font-weight:900;color:var(--cheese-dark);}
  .win-subtitle{font-size:1rem;color:var(--grey-dark);font-weight:600;line-height:1.4;}
  .win-btns{display:flex;gap:10px;width:100%;}
  .restart-btn{flex:1;background:var(--cheese);border:none;border-radius:16px;
    font-family:'Nunito',sans-serif;font-size:.95rem;font-weight:900;color:var(--text);
    cursor:pointer;padding:13px 0;transition:all .15s;}
  .restart-btn:hover{background:var(--cheese-dark);color:white;}
  .restart-btn.secondary{background:var(--purple);color:white;}
  .restart-btn.secondary:hover{background:#7B5FC4;}
</style>
</head>
<body>

<div class="header">

  <div id="taskSection">

<script>
// ═══ VOICE — natural & squeaky ════════════════════════
// Strategy: pick the best available Russian female voice,
// use moderate rate (1.15) so speech sounds natural,
// and pitch 1.8 for the mouse squeakiness without robotic distortion.
const synth = window.speechSynthesis;
let ruVoice = null;
let soundOn = true;
let currentTaskText = '';
let voiceTimer = null;

function pickVoice() {
  const vs = synth.getVoices();
  if (!vs.length) return;
  // Priority: online neural Russian female > any Russian > fallback
  const pref = [
    // Google natural voices (Chrome)
    v => v.name.includes('Google') && v.lang.startsWith('ru') && /женщин|female|woman|Milena|Irina|Anna/i.test(v.name),
    v => v.name.includes('Google') && v.lang.startsWith('ru'),
    // Microsoft natural voices (Edge/Windows)
    v => /Svetlana|Dariya|Irina|Anna|Milena/i.test(v.name) && v.lang.startsWith('ru'),
    v => v.lang === 'ru-RU',
    v => v.lang.startsWith('ru'),
    v => true,
  ];
  for (const fn of pref) {
    const found = vs.find(fn);
    if (found) { ruVoice = found; return; }
  }
}
pickVoice();
if (synth.onvoiceschanged !== undefined) {
  synth.onvoiceschanged = pickVoice;
}

function speakNow(text) {
  if (!soundOn || !text) return;
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ru-RU';
  u.rate  = 1.15;  // natural speed — not robotic slow, not chipmunk fast
  u.pitch = 1.75;  // high enough to feel "mousy", low enough to be clear
  u.volume = 1;
  if (ruVoice) u.voice = ruVoice;
  u.onstart = () => setSpeakUI(true);
  u.onend = u.onerror = () => setSpeakUI(false);
  synth.speak(u);
}
function speakAfter(text, ms) {
  clearTimeout(voiceTimer);
  voiceTimer = setTimeout(() => speakNow(text), ms);
}
function stopVoice() {
  clearTimeout(voiceTimer);
  synth.cancel();
  setSpeakUI(false);
}
function setSpeakUI(on) {
  document.getElementById('speakingDots').classList.toggle('active', on);
  const svg = document.getElementById('mouseSvg');
  if (on) {
    svg._prevMood = svg.getAttribute('data-mood');
    svg.setAttribute('data-mood', 'speaking');
  } else {
    svg.setAttribute('data-mood', svg._prevMood || 'thinking');
    svg._prevMood = null;
  }
}
function toggleSound() {
  soundOn = !soundOn;
  if (!soundOn) stopVoice();
  document.getElementById('soundBtn').textContent = soundOn ? '🔊' : '🔇';
  document.getElementById('soundBtn').classList.toggle('muted', !soundOn);
  if (soundOn) speakNow('Звук включён!');
}
function readTaskAloud() { stopVoice(); speakNow(currentTaskText); }
// ═════════════════════════════════════════════════════

const TOTAL = 10;
const LEVELS = {
  1:{max:10,label:'Ур. 1',name:'до 10', crossTen:false},
  2:{max:20,label:'Ур. 2',name:'до 20', crossTen:true},
  3:{max:50,label:'Ур. 3',name:'до 50', crossTen:true},
  4:{max:100,label:'Ур. 4',name:'до 100',crossTen:true},
};
let level=1, op='add', questionIndex=0, correctCount=0, wrongCount=0;
let answered=false, correctAnswer=0, cheesePieces=0;

// ═══ PHRASES — lots of fun ones! ══════════════════════
const phrases = {
  ask: [
    'Иван, помоги мне! Если правильно — дам сыр!',

    'Ура-ура-ура! Правильно! Нюсик прыгает от счастья!',

    'Суперзвезда! Иван, ты лучший!',
    'Именно! Именно так! Умница какая!',
    'Нюсик счастлив! Сыр достался нам двоим!',

    'Вот это мозги! Нюсик восхищается!',

  streak3: [

  ],
  streak5: [
    'Пять подряд! Нюсик не верит своим ушам!',
    'Пять верных ответов! Ты супергерой математики!',
  ],
  hint_cross: [
    'Подсказка: сначала доберись до круглого числа!',
    'Попробуй разбить на два шага — до десятки и дальше!',
    'Совет от Нюсика: считай через десяток!',
  ],
  win3: [
    'Нюсик в полном восторге! Ты настоящий математик!',
    'Кладовочка полная! Спасибо тебе, Иван!',
    'Блестящий результат! Нюсик тобой гордится!',
  ],
  win2: [
    'Хорошая работа! Ещё немного потренируемся?',
    'Нюсик доволен! Мы справились вместе!',
    'Молодец! С каждым разом лучше и лучше!',
  ],
  win1: [
    'Нюсик верит — в следующий раз будет лучше!',
    'Не сдавайся! Попробуем ещё раз вместе!',
    'Математика — это тренировка. Попробуем снова?',
  ],
};

function rnd(a){ return a[Math.floor(Math.random()*a.length)]; }

// Track correct streak for bonus praise
let streak = 0;

function setMouseMood(mood) {
  const svg = document.getElementById('mouseSvg');
  if (svg.getAttribute('data-mood') === 'speaking') { svg._prevMood = mood; }
  else { svg.setAttribute('data-mood', mood); }
  const pL=document.getElementById('pupilL'),pR=document.getElementById('pupilR');
  const gL=document.getElementById('glintL'),gR=document.getElementById('glintR');
  const mouth=document.getElementById('mouthPath');
  const cheese=document.getElementById('cheeseInPaw');
  if (mood==='happy') {
    [pL,pR].forEach(p=>{p.setAttribute('cy','70');p.setAttribute('r','4');});
    gL.style.display=gR.style.display='';
    mouth.setAttribute('d','M 60 92 Q 70 102 80 92'); cheese.style.display='';
  } else if (mood==='sad') {
    [pL,pR].forEach(p=>{p.setAttribute('cy','70');p.setAttribute('r','3.5');});
    gL.style.display=gR.style.display='none';
    mouth.setAttribute('d','M 62 97 Q 70 91 78 97'); cheese.style.display='none';
  } else {
    [pL,pR].forEach(p=>{p.setAttribute('cy','68');p.setAttribute('r','4');});
    gL.style.display=gR.style.display='';
    mouth.setAttribute('d','M 62 93 Q 70 99 78 93'); cheese.style.display='none';
  }
}

function setLevel(l) {
  level=l;
  document.querySelectorAll('.level-btn').forEach((b,i)=>b.classList.toggle('active',i+1===l));
  document.getElementById('levelBadge').textContent=LEVELS[l].label;
  restartGame();
}
function setOp(o) {
  op=o;
  document.querySelectorAll('.op-btn').forEach((b,i)=>b.classList.toggle('active',['add','sub','both'][i]===o));
  restartGame();
}
function nextLevel(){ if(level<4)setLevel(level+1); else restartGame(); }

function generateQuestion() {
  const cfg=LEVELS[level];
  let a,b,useAdd,hintText='',hintSpeech='';
  if(op==='add')useAdd=true;
  else if(op==='sub')useAdd=false;
  else useAdd=Math.random()>.5;

  if(useAdd){
    if(cfg.crossTen&&Math.random()>.4){
      const dec=Math.floor(Math.random()*Math.floor((cfg.max-10)/10))*10;
      const rem=Math.floor(Math.random()*8)+1;
      a=dec+rem; const cross=10-rem;
      b=cross+Math.floor(Math.random()*Math.min(9,cfg.max-a-cross));
      if(b<=0)b=cross;
    } else {
      a=Math.floor(Math.random()*(cfg.max-1))+1;
      b=Math.floor(Math.random()*(cfg.max-a))+1;
    }
    correctAnswer=a+b;
    if(correctAnswer>cfg.max){a=Math.max(1,cfg.max-9);b=Math.floor(Math.random()*9)+1;correctAnswer=a+b;}
    if(cfg.crossTen&&correctAnswer>10&&a%10!==0&&b%10!==0){
      hintText='💡 Считай через десяток!';
      hintSpeech=rnd(phrases.hint_cross);
    }
  } else {
    if(cfg.crossTen&&Math.random()>.4){
      const dec=(Math.floor(Math.random()*Math.floor(cfg.max/10))+1)*10;
      a=dec+Math.floor(Math.random()*Math.min(9,cfg.max-dec));
      b=Math.floor(Math.random()*(dec%10===0?Math.min(9,a-dec+1):a-(dec-10)))+1;
      if(a<=0||b<=0||b>=a){a=15;b=7;}
    } else {
      a=Math.floor(Math.random()*(cfg.max-1))+2;
      b=Math.floor(Math.random()*(a-1))+1;
    }
    correctAnswer=a-b;
    if(correctAnswer<0){a=10;b=3;correctAnswer=7;}
  }

  document.getElementById('hint').textContent=hintText;
  const opSign=useAdd?'+':'−', opWord=useAdd?'плюс':'минус';
  currentTaskText=`${a} ${opWord} ${b} — сколько получится?`;
  document.getElementById('taskExpr').innerHTML=
    `<span>${a}</span><span class="op"> ${opSign} </span><span>${b}</span><span class="eq"> = </span><span>?</span>`;

  const spread=cfg.max<=10?3:cfg.max<=20?5:10;
  const choices=new Set([correctAnswer]);
  let tries=0;
  while(choices.size<4&&tries<100){
    tries++; const d=Math.floor(Math.random()*spread)+1;
    const w=correctAnswer+(Math.random()>.5?d:-d);
    if(w>=0&&w<=cfg.max+5&&w!==correctAnswer)choices.add(w);
  }
  while(choices.size<4)choices.add(correctAnswer+choices.size);

  const grid=document.getElementById('answersGrid');
  grid.innerHTML='';
  [...choices].sort(()=>Math.random()-.5).forEach(n=>{
    const btn=document.createElement('button');
    btn.className='answer-btn'; btn.textContent=n;
    btn.onclick=()=>checkAnswer(n,btn);
    grid.appendChild(btn);
  });

  setMouseMood('thinking');
  const phrase=rnd(phrases.ask);
  setBubble(phrase,'');

  const nb=document.getElementById('nextBtn');
  nb.disabled=true; nb.textContent='Выбери ответ ↑';
  answered=false;

  stopVoice();
  speakNow(phrase);
  // After phrase: read the task, then hint if any
  const taskDelay = phrase.length * 60 + 400;
  speakAfter(currentTaskText, taskDelay);
  if (hintSpeech) speakAfter(hintSpeech, taskDelay + currentTaskText.length*60 + 600);
}

function checkAnswer(chosen,btn){
  if(answered)return;
  answered=true;
  stopVoice();
  document.querySelectorAll('.answer-btn').forEach(b=>b.disabled=true);

  const nb=document.getElementById('nextBtn');

  if(chosen===correctAnswer){
    btn.classList.add('correct');
    correctCount++; cheesePieces++; streak++;
    document.getElementById('correctCount').textContent=correctCount;
    addCheese();
    setMouseMood('happy');

    // Pick praise — streak bonus overrides regular
    let phrase;
    if(streak===5) phrase=rnd(phrases.streak5);
    else if(streak===3) phrase=rnd(phrases.streak3);
    else phrase=rnd(phrases.correct);

    setBubble(phrase,'happy-bubble');
    speakNow(phrase);
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.answer-btn').forEach(b=>{
      if(parseInt(b.textContent)===correctAnswer)b.classList.add('correct');
    });
    wrongCount++; streak=0;
    document.getElementById('wrongCount').textContent=wrongCount;
    setMouseMood('sad');
    const phrase=rnd(phrases.wrong);
    setBubble(phrase,'sad-bubble');
    speakNow(phrase);
    speakAfter(`Правильный ответ: ${correctAnswer}`, phrase.length*55+500);
  }

  questionIndex++;
  updateProgress();

  if(questionIndex>=TOTAL){
    setTimeout(showWin,1400);
  } else {
    nb.disabled=false; nb.textContent='Дальше! →';
  }
}

function nextQuestion(){ generateQuestion(); }

function updateProgress(){
  document.getElementById('progressFill').style.width=(questionIndex/TOTAL*100)+'%';
  document.getElementById('progressText').textContent=questionIndex+'/'+TOTAL;
}
function addCheese(){
  const s=document.createElement('span');
  s.className='cheese-piece'; s.textContent='🧀';
  document.getElementById('cheeseRow').appendChild(s);
}
function setBubble(text,cls){
  const b=document.getElementById('bubble');
  b.textContent=text; b.className='bubble '+cls;
}

function showWin(){
  stopVoice();
  document.getElementById('taskSection').style.display='none';
  document.getElementById('winOverlay').classList.add('visible');
  setMouseMood('happy');
  const cfg=LEVELS[level]; const pct=correctCount/TOTAL;
  let stars,title,sub,speech;
  if(pct>=.9){
    stars='⭐⭐⭐'; title='Кладовочка полная!';
    sub=`${correctCount} из ${TOTAL} правильно! Уровень «${cfg.name}» покорён!`;
    speech=`Ура! ${correctCount} из ${TOTAL}! ` + rnd(phrases.win3);
  } else if(pct>=.6){
    stars='⭐⭐'; title='Хорошая работа!';
    sub=`${correctCount} из ${TOTAL}. Нюсик доволен!`;
    speech=`${correctCount} из ${TOTAL}. ` + rnd(phrases.win2);
  } else {
    stars='⭐'; title='Нюсик верит в тебя!';
    sub=`${correctCount} из ${TOTAL}. Попробуем ещё раз!`;
    speech=rnd(phrases.win1);
  }
  document.getElementById('winStars').textContent=stars;
  document.getElementById('winTitle').textContent=title;
  document.getElementById('winSubtitle').textContent=sub;
  document.querySelector('.restart-btn.secondary').style.display=level>=4?'none':'';
  speakAfter(speech,400);
}

function restartGame(){
  stopVoice();
  questionIndex=0; correctCount=0; wrongCount=0; cheesePieces=0; streak=0;
  document.getElementById('cheeseRow').innerHTML='';
  document.getElementById('correctCount').textContent='0';
  document.getElementById('wrongCount').textContent='0';
  document.getElementById('taskSection').style.display='';
  document.getElementById('winOverlay').classList.remove('visible');
  updateProgress();
  generateQuestion();
}

generateQuestion();
</script>
</body>
</html>
