<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Нюсик учит математику</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&display=swap');
  :root {
    --cream:#FFF8F0;--warm:#FFF0DC;--grey-light:#E8E4E0;--grey:#B0A8A0;
    --grey-dark:#6B6360;--cheese:#F5C842;--cheese-dark:#E0A800;
    --green:#5CC87A;--green-dark:#3DA85C;--red:#FF6B6B;
    --purple:#9B7FD4;--blue:#5BA4CF;--text:#3A3330;
  }
  *{box-sizing:border-box;margin:0;padding:0;}

  /* ── DESKTOP: everything in 100vh, two-column card ── */
  body {
    font-family:'Nunito',sans-serif;
    background:var(--cream);
    color:var(--text);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:8px 12px 8px;
    overflow:hidden; /* no scroll on desktop */
  }

  /* Header */
  .header{text-align:center;margin-bottom:6px;position:relative;width:100%;max-width:900px;}
  .header h1{font-size:1.5rem;font-weight:900;color:var(--grey-dark);}
  .header h1 span{color:var(--cheese-dark);}
  .sound-btn{position:absolute;right:0;top:50%;transform:translateY(-50%);
    background:white;border:2px solid var(--grey-light);border-radius:10px;
    font-size:1.2rem;width:40px;height:40px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:all .15s;}
  .sound-btn:hover{background:var(--grey-light);}
  .sound-btn.muted{opacity:.45;}

  /* Top controls row */
  .controls-row{display:flex;gap:8px;width:100%;max-width:900px;margin-bottom:6px;}
  .level-bar{display:flex;gap:5px;flex:1;}
  .op-bar{display:flex;gap:5px;}
  .level-btn{flex:1;padding:5px 2px;border:2px solid var(--grey-light);border-radius:10px;
    background:white;font-family:'Nunito',sans-serif;font-size:.68rem;font-weight:800;
    color:var(--grey-dark);cursor:pointer;transition:all .15s;line-height:1.25;text-align:center;}
  .level-btn.active{background:var(--purple);border-color:var(--purple);color:white;}
  .level-btn:hover:not(.active){background:var(--grey-light);}
  .op-btn{padding:5px 14px;border:2px solid var(--grey-light);border-radius:10px;
    background:white;font-family:'Nunito',sans-serif;font-size:.8rem;font-weight:800;
    color:var(--grey-dark);cursor:pointer;transition:all .15s;white-space:nowrap;}
  .op-btn.active{background:var(--blue);border-color:var(--blue);color:white;}
  .op-btn:hover:not(.active){background:var(--grey-light);}

  /* Cheese store */
  .cheese-store{background:var(--warm);border:2px solid var(--cheese);border-radius:14px;
    padding:5px 14px;margin-bottom:6px;text-align:center;width:100%;max-width:900px;}
  .cheese-store-label{font-size:.68rem;font-weight:800;color:var(--grey-dark);
    text-transform:uppercase;letter-spacing:1px;margin-bottom:2px;}
  .cheese-row{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;min-height:22px;}
  .cheese-piece{font-size:1.1rem;animation:popIn .3s cubic-bezier(.36,.07,.19,.97);}

  /* Main card — two columns on desktop */
  .card{background:white;border-radius:22px;padding:16px;width:100%;max-width:900px;
    box-shadow:0 4px 24px rgba(0,0,0,.07);
    display:flex;gap:20px;flex:1;min-height:0;}

  /* Left column: mouse */
  .left-col{display:flex;flex-direction:column;align-items:center;justify-content:center;
    width:220px;flex-shrink:0;}
  .bubble-wrap{margin-bottom:8px;width:100%;}
  .bubble{background:var(--grey-light);border-radius:16px 16px 16px 4px;
    padding:10px 14px;font-size:1rem;font-weight:700;color:var(--grey-dark);
    text-align:center;line-height:1.4;min-height:52px;
    display:flex;align-items:center;justify-content:center;transition:background .3s,color .3s;}
  .bubble.happy-bubble{background:#D4F5DC;color:#2A7A40;}
  .bubble.sad-bubble{background:#FFE5E5;color:#B03030;}
  .speaking-dots{display:none;justify-content:center;gap:4px;margin-top:4px;}
  .speaking-dots.active{display:flex;}
  .speaking-dots span{width:6px;height:6px;background:var(--purple);border-radius:50%;
    animation:dotBounce .7s ease infinite;}
  .speaking-dots span:nth-child(2){animation-delay:.15s;}
  .speaking-dots span:nth-child(3){animation-delay:.3s;}
  .mouse-svg{width:150px;height:150px;}

  /* Right column: game */
  .right-col{flex:1;display:flex;flex-direction:column;justify-content:space-between;min-width:0;}

  .task-area{text-align:center;margin-bottom:8px;}
  .task-label{font-size:.72rem;font-weight:800;color:var(--grey);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:4px;}
  .level-badge{display:inline-block;background:var(--purple);color:white;font-size:.65rem;
    font-weight:800;border-radius:7px;padding:2px 7px;margin-left:5px;vertical-align:middle;}
  .task-expression{font-size:3.2rem;font-weight:900;color:var(--text);letter-spacing:-1px;
    min-height:62px;display:flex;align-items:center;justify-content:center;gap:8px;
    cursor:pointer;border-radius:10px;transition:background .15s;padding:4px 8px;}
  .task-expression:hover{background:var(--grey-light);}
  .task-expression .op{color:var(--purple);}
  .task-expression .eq{color:var(--grey);}
  .hint{font-size:.78rem;color:var(--blue);font-weight:700;margin-top:2px;min-height:18px;}
  .read-task-btn{background:none;border:2px dashed var(--grey-light);border-radius:9px;
    color:var(--grey);font-family:'Nunito',sans-serif;font-size:.73rem;font-weight:700;
    padding:3px 10px;cursor:pointer;margin-top:4px;transition:all .15s;}
  .read-task-btn:hover{border-color:var(--purple);color:var(--purple);background:#F3EEFF;}

  .answers-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
  .answer-btn{background:var(--warm);border:3px solid var(--cheese);border-radius:14px;
    font-family:'Nunito',sans-serif;font-size:1.9rem;font-weight:900;color:var(--text);
    cursor:pointer;padding:12px 0;transition:all .15s;-webkit-tap-highlight-color:transparent;}
  .answer-btn:hover:not(:disabled){background:var(--cheese);transform:scale(1.03);}
  .answer-btn:active:not(:disabled){transform:scale(.97);}
  .answer-btn.correct{background:var(--green);border-color:var(--green-dark);color:white;animation:popIn .3s;}
  .answer-btn.wrong{background:var(--red);border-color:#C04040;color:white;animation:shake .4s;}

  .next-btn{display:block;width:100%;border:none;border-radius:14px;
    font-family:'Nunito',sans-serif;font-size:1rem;font-weight:900;
    cursor:pointer;padding:11px 0;margin-bottom:8px;transition:background .2s,color .2s;}
  .next-btn:disabled{background:var(--grey-light);color:var(--grey);cursor:default;}
  .next-btn:not(:disabled){background:var(--green);color:white;}
  .next-btn:not(:disabled):hover{background:var(--green-dark);}

  .progress-row{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
  .progress-bar-bg{flex:1;height:9px;background:var(--grey-light);border-radius:8px;overflow:hidden;}
  .progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--cheese),var(--green));
    border-radius:8px;transition:width .4s ease;}
  .progress-text{font-size:.75rem;font-weight:800;color:var(--grey);min-width:34px;text-align:right;}
  .score-row{display:flex;gap:16px;justify-content:center;font-size:.82rem;font-weight:700;color:var(--grey);}
  .correct-count{color:var(--green-dark);}.wrong-count{color:var(--red);}

  /* Win overlay covers the right column */
  .win-overlay{display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;text-align:center;flex:1;}
  .win-overlay.visible{display:flex;animation:popIn .5s;}
  .win-stars{font-size:2.2rem;letter-spacing:4px;}
  .win-title{font-size:1.4rem;font-weight:900;color:var(--cheese-dark);}
  .win-subtitle{font-size:.95rem;color:var(--grey-dark);font-weight:600;line-height:1.4;}
  .win-btns{display:flex;gap:10px;width:100%;}
  .restart-btn{flex:1;background:var(--cheese);border:none;border-radius:14px;
    font-family:'Nunito',sans-serif;font-size:.9rem;font-weight:900;color:var(--text);
    cursor:pointer;padding:11px 0;transition:all .15s;}
  .restart-btn:hover{background:var(--cheese-dark);color:white;}
  .restart-btn.secondary{background:var(--purple);color:white;}
  .restart-btn.secondary:hover{background:#7B5FC4;}

  /* Setup screen */
  .setup-screen{display:flex;flex-direction:column;align-items:center;gap:14px;
    background:white;border-radius:28px;padding:28px 20px;width:100%;max-width:480px;
    box-shadow:0 4px 24px rgba(0,0,0,.07);text-align:center;margin-top:40px;}
  .setup-screen h2{font-size:1.2rem;font-weight:900;color:var(--grey-dark);}
  .setup-screen p{font-size:.9rem;color:var(--grey);line-height:1.5;}
  .setup-screen input{width:100%;padding:12px 14px;border:2px solid var(--grey-light);
    border-radius:12px;font-family:'Nunito',sans-serif;font-size:.9rem;color:var(--text);}
  .setup-screen input:focus{outline:none;border-color:var(--purple);}
  .setup-btn{background:var(--purple);color:white;border:none;border-radius:14px;
    font-family:'Nunito',sans-serif;font-size:1rem;font-weight:900;
    padding:13px 0;width:100%;cursor:pointer;transition:background .15s;}
  .setup-btn:hover{background:#7B5FC4;}
  .setup-note{font-size:.75rem;color:var(--grey);line-height:1.4;}
  .err-banner{background:#FFE5E5;border:2px solid var(--red);border-radius:12px;
    padding:10px 14px;font-size:.82rem;font-weight:700;color:#B03030;display:none;margin-top:4px;line-height:1.5;}
  .voice-select{width:100%;padding:10px 14px;border:2px solid var(--grey-light);
    border-radius:12px;font-family:'Nunito',sans-serif;font-size:.9rem;color:var(--text);
    background:white;cursor:pointer;}
  .voice-select:focus{outline:none;border-color:var(--purple);}

  /* Animations */
  @keyframes popIn{0%{transform:scale(0) rotate(-20deg);opacity:0;}70%{transform:scale(1.3) rotate(5deg);}100%{transform:scale(1) rotate(0);opacity:1;}}
  @keyframes dotBounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
  @keyframes wiggle{0%,100%{transform:rotate(0);}25%{transform:rotate(-8deg) scale(1.05);}75%{transform:rotate(8deg) scale(1.05);}}
  @keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-6px);}40%{transform:translateX(6px);}60%{transform:translateX(-4px);}80%{transform:translateX(4px);}}
  @keyframes bop{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
  @keyframes mousePulse{from{transform:scale(1);}to{transform:scale(1.08) rotate(2deg);}}
  .mouse-svg[data-mood="happy"]{animation:wiggle .5s ease;}
  .mouse-svg[data-mood="sad"]{animation:shake .4s ease;}
  .mouse-svg[data-mood="thinking"]{animation:bop 1.2s ease infinite;}
  .mouse-svg[data-mood="speaking"]{animation:mousePulse .4s ease infinite alternate;}

  /* Mobile fallback */
  @media(max-width:640px){
    body{overflow:auto;padding:10px 10px 24px;}
    .card{flex-direction:column;gap:0;}
    .left-col{width:100%;flex-direction:row;justify-content:center;gap:12px;padding-bottom:12px;
      border-bottom:2px solid var(--grey-light);margin-bottom:12px;}
    .bubble-wrap{margin-bottom:0;flex:1;}
    .mouse-svg{width:100px;height:100px;flex-shrink:0;}
    .controls-row{flex-direction:column;gap:6px;}
    .op-bar{justify-content:stretch;}
    .op-btn{flex:1;text-align:center;}
  }
</style>
</head>
<body>

<div class="header">
  <h1>🧀 Нюсик и <span>математика</span></h1>
  <button class="sound-btn" id="soundBtn" onclick="toggleSound()">🔊</button>
</div>

<!-- Setup screen -->
<div class="setup-screen" id="setupScreen" style="display:none">
  <div style="font-size:3rem">🐭</div>
  <h2>Привет! Настройка голоса Нюсика</h2>
  <p>Введи API ключ ElevenLabs и выбери голос.</p>
  <input type="password" id="apiKeyInput" placeholder="sk_..." />
  <select class="voice-select" id="voiceSelect">
    <option value="EXAVITQu4vr4xnSDxMaL">Bella — мягкий женский (Free)</option>
    <option value="21m00Tcm4TlvDq8ikWAM">Rachel — спокойный (Free)</option>
    <option value="AZnzlk1XvdvUeBnXmlld">Domi — живой, энергичный (Free)</option>
    <option value="MF3mGyEYCl7XYWbV9V6O">Elli — молодой женский (Free)</option>
    <option value="TxGEqnHWrfWFTfGW9XjX">Josh — мужской тёплый (Free)</option>
    <option value="rSfuQoQ3FY8SVKeraMAp">Lunya little fairy (платный)</option>
  </select>
  <button class="setup-btn" id="setupBtn" onclick="saveApiKey()">Проверить и начать! 🐭</button>

  <p class="setup-note">Ключ хранится только на этом устройстве. Его никто не увидит.</p>
</div>

<!-- Game -->
<div id="gameWrapper" style="display:none;width:100%;max-width:900px;display:none;flex-direction:column;flex:1;min-height:0;">

  <div class="controls-row">
    <div class="level-bar">
      <button class="level-btn active" onclick="setLevel(1)">⭐ Ур.1<br><small>до 10</small></button>
      <button class="level-btn" onclick="setLevel(2)">⭐⭐ Ур.2<br><small>до 20</small></button>
      <button class="level-btn" onclick="setLevel(3)">⭐⭐⭐ Ур.3<br><small>до 50</small></button>
      <button class="level-btn" onclick="setLevel(4)">🏆 Ур.4<br><small>до 100</small></button>
    </div>
    <div class="op-bar">
      <button class="op-btn" onclick="setOp('add')">➕ Сложение</button>
      <button class="op-btn" onclick="setOp('sub')">➖ Вычитание</button>
      <button class="op-btn active" onclick="setOp('both')">🎲 Оба!</button>
    </div>
  </div>

  <div class="cheese-store">
    <div class="cheese-store-label">🏠 Кладовочка Нюсика</div>
    <div class="cheese-row" id="cheeseRow"></div>
  </div>

  <div class="card">
    <!-- Left: mouse -->
    <div class="left-col">
      <div class="bubble-wrap">
        <div class="bubble" id="bubble">Привет, Иван! Я Нюсик. Помоги мне найти сыр!</div>
        <div class="speaking-dots" id="speakingDots"><span></span><span></span><span></span></div>
      </div>
      <svg class="mouse-svg" id="mouseSvg" data-mood="thinking" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="42" cy="48" rx="18" ry="20" fill="#C8C0BC"/>
        <ellipse cx="98" cy="48" rx="18" ry="20" fill="#C8C0BC"/>
        <ellipse cx="42" cy="49" rx="11" ry="13" fill="#E8C0C0"/>
        <ellipse cx="98" cy="49" rx="11" ry="13" fill="#E8C0C0"/>
        <ellipse cx="70" cy="98" rx="34" ry="28" fill="#B0A8A0"/>
        <ellipse cx="70" cy="74" rx="32" ry="29" fill="#C4BDB8"/>
        <ellipse cx="70" cy="87" rx="8" ry="5" fill="#DDB0B0"/>
        <circle cx="70" cy="86" r="4" fill="#C88888"/>
        <line x1="62" y1="85" x2="36" y2="81" stroke="#999" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="62" y1="87" x2="36" y2="87" stroke="#999" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="62" y1="89" x2="36" y2="93" stroke="#999" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="78" y1="85" x2="104" y2="81" stroke="#999" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="78" y1="87" x2="104" y2="87" stroke="#999" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="78" y1="89" x2="104" y2="93" stroke="#999" stroke-width="1.5" stroke-linecap="round"/>
        <g id="eyes">
          <circle cx="58" cy="68" r="7" fill="white"/><circle cx="82" cy="68" r="7" fill="white"/>
          <circle cx="59" cy="69" r="4" fill="#3A3330" id="pupilL"/>
          <circle cx="83" cy="69" r="4" fill="#3A3330" id="pupilR"/>
          <circle cx="60" cy="67.5" r="1.5" fill="white" id="glintL"/>
          <circle cx="84" cy="67.5" r="1.5" fill="white" id="glintR"/>
        </g>
        <path id="mouthPath" d="M 62 93 Q 70 100 78 93" fill="none" stroke="#8B5E5E" stroke-width="2" stroke-linecap="round"/>
        <path d="M 100 118 Q 120 130 116 110 Q 112 95 128 88" fill="none" stroke="#B0A8A0" stroke-width="5" stroke-linecap="round"/>
        <ellipse cx="50" cy="122" rx="12" ry="7" fill="#B0A8A0"/>
        <ellipse cx="90" cy="122" rx="12" ry="7" fill="#B0A8A0"/>
        <g id="cheeseInPaw" style="display:none">
          <rect x="96" y="104" width="22" height="18" rx="4" fill="#F5C842" transform="rotate(-15,107,113)"/>
          <circle cx="101" cy="109" r="2.5" fill="#E0A800" transform="rotate(-15,107,113)"/>
          <circle cx="110" cy="115" r="2" fill="#E0A800" transform="rotate(-15,107,113)"/>
        </g>
      </svg>
    </div>

    <!-- Right: task -->
    <div class="right-col">
      <div id="taskSection">
        <div class="task-area">
          <div class="task-label">Какой ответ? <span class="level-badge" id="levelBadge">Ур. 1</span></div>
          <div class="task-expression" id="taskExpr" onclick="readTaskAloud()"></div>
          <div class="hint" id="hint"></div>
          <button class="read-task-btn" onclick="readTaskAloud()">🔊 Прочитать задание</button>
        </div>
        <div class="answers-grid" id="answersGrid"></div>
        <button class="next-btn" id="nextBtn" disabled onclick="nextQuestion()">Выбери ответ ↑</button>
        <div class="progress-row">
          <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div>
          <div class="progress-text" id="progressText">0/10</div>
        </div>
        <div class="score-row">
          <span>✅ <span class="correct-count" id="correctCount">0</span></span>
          <span>❌ <span class="wrong-count" id="wrongCount">0</span></span>
        </div>

      <div class="win-overlay" id="winOverlay">
        <div class="win-stars" id="winStars">⭐⭐⭐</div>

        <div class="win-subtitle" id="winSubtitle"></div>
        <div class="win-btns">
          <button class="restart-btn" onclick="restartGame()">Ещё раз! 🔄</button>
          <button class="restart-btn secondary" onclick="nextLevel()">Сложнее! ⬆️</button>
        </div>
      </div>
    </div>

</div>

<script>
const STORAGE_KEY   = 'nyusik_xi_key_v3';
const STORAGE_VOICE = 'nyusik_xi_voice_v3';
const XI_MODEL      = 'eleven_multilingual_v2';

let XI_KEY      = localStorage.getItem(STORAGE_KEY)   || '';
let XI_VOICE_ID = localStorage.getItem(STORAGE_VOICE) || 'EXAVITQu4vr4xnSDxMaL';
let soundOn = true, currentTaskText = '', currentAudio = null, voiceTimer = null;
const audioCache = new Map();

// ── Setup ────────────────────────────────────────────
async function saveApiKey() {
  const val   = document.getElementById('apiKeyInput').value.trim();
  const voice = document.getElementById('voiceSelect').value;
  if (!val.startsWith('sk_') || val.length < 20) { showErr('Ключ должен начинаться с sk_ и быть длиннее 20 символов'); return; }
  const btn = document.getElementById('setupBtn');
  btn.textContent = 'Проверяем...'; btn.disabled = true; hideErr();
  try {
    const resp = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voice}`, {
      method:'POST', headers:{'xi-api-key':val,'Content-Type':'application/json'},
      body:JSON.stringify({text:'Привет!',model_id:XI_MODEL,voice_settings:{stability:.4,similarity_boost:.8,style:.4,use_speaker_boost:true}}),
    });
    if (resp.status===401){ showErr('Ключ неверный.'); reset(); return; }
    if (resp.status===402){ showErr('402: лимит символов исчерпан. Попробуй другой голос или пополни баланс на elevenlabs.io.'); reset(); return; }
    if (resp.status===404){ showErr('Голос не найден. Выбери другой из списка.'); reset(); return; }
    if (!resp.ok){ showErr(`Ошибка ElevenLabs: ${resp.status}`); reset(); return; }
    const blob = await resp.blob();
    new Audio(URL.createObjectURL(blob)).play().catch(()=>{});
    XI_KEY = val; XI_VOICE_ID = voice;
    localStorage.setItem(STORAGE_KEY, val); localStorage.setItem(STORAGE_VOICE, voice);
    setTimeout(startGame, 1000);
  } catch(e) { showErr('Ошибка сети.'); reset(); }
}
function reset(){ const b=document.getElementById('setupBtn'); b.textContent='Проверить и начать! 🐭'; b.disabled=false; }
function showErr(m){ const b=document.getElementById('errBanner'); b.textContent=m; b.style.display='block'; }
function hideErr(){ document.getElementById('errBanner').style.display='none'; }

function startGame(){
  document.getElementById('setupScreen').style.display='none';
  const gw = document.getElementById('gameWrapper');
  gw.style.display='flex';
  generateQuestion();
}
window.addEventListener('DOMContentLoaded',()=>{
  if(XI_KEY) startGame();
  else document.getElementById('setupScreen').style.display='flex';
});

// ── ElevenLabs TTS ───────────────────────────────────
async function speakNow(text) {
  if (!soundOn || !text) return;
  stopVoice(); setSpeakUI(true);
  try {
    let url = audioCache.get(text);
    if (!url) {
      const resp = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${XI_VOICE_ID}`, {
        method:'POST', headers:{'xi-api-key':XI_KEY,'Content-Type':'application/json'},
        body:JSON.stringify({text, model_id:XI_MODEL,
          voice_settings:{stability:.4,similarity_boost:.8,style:.4,use_speaker_boost:true}}),
      });
      if (!resp.ok) throw new Error(resp.status);
      const blob = await resp.blob();
      url = URL.createObjectURL(blob);
      if (audioCache.size > 50) audioCache.delete(audioCache.keys().next().value);
      audioCache.set(text, url);
    }
    currentAudio = new Audio(url);
    await new Promise((resolve) => {
      currentAudio.onended = () => { setSpeakUI(false); resolve(); };
      currentAudio.onerror = () => { setSpeakUI(false); resolve(); };
      currentAudio.play().catch(() => { setSpeakUI(false); resolve(); });
    });
  } catch(e) { console.warn('XI:', e.message); setSpeakUI(false); }
}
function speakAfter(text,ms){ clearTimeout(voiceTimer); voiceTimer=setTimeout(()=>speakNow(text),ms); }
function stopVoice(){
  clearTimeout(voiceTimer);
  if(currentAudio){currentAudio.onended=null;currentAudio.onerror=null;currentAudio.pause();currentAudio=null;}
  setSpeakUI(false);
}
function setSpeakUI(on){
  const d=document.getElementById('speakingDots'); if(d)d.classList.toggle('active',on);
  const s=document.getElementById('mouseSvg'); if(!s)return;
  if(on){s._pm=s.getAttribute('data-mood');s.setAttribute('data-mood','speaking');}
  else{s.setAttribute('data-mood',s._pm||'thinking');s._pm=null;}
}
function toggleSound(){
  soundOn=!soundOn; if(!soundOn)stopVoice();
  document.getElementById('soundBtn').textContent=soundOn?'🔊':'🔇';
  document.getElementById('soundBtn').classList.toggle('muted',!soundOn);
  if(soundOn)speakNow('Звук включён!');
}
function readTaskAloud(){ stopVoice(); speakNow(currentTaskText); }

function rnd(a){return a[Math.floor(Math.random()*a.length)];}

function setMouseMood(mood){
  const s=document.getElementById('mouseSvg');if(!s)return;
  if(s.getAttribute('data-mood')==='speaking'){s._pm=mood;}else{s.setAttribute('data-mood',mood);}
  const pL=document.getElementById('pupilL'),pR=document.getElementById('pupilR');
  const gL=document.getElementById('glintL'),gR=document.getElementById('glintR');
  const mouth=document.getElementById('mouthPath'),cheese=document.getElementById('cheeseInPaw');
  if(mood==='happy'){[pL,pR].forEach(p=>{p.setAttribute('cy','70');p.setAttribute('r','4');});
    gL.style.display=gR.style.display='';mouth.setAttribute('d','M 60 92 Q 70 102 80 92');cheese.style.display='';}
  else if(mood==='sad'){[pL,pR].forEach(p=>{p.setAttribute('cy','70');p.setAttribute('r','3.5');});
    gL.style.display=gR.style.display='none';mouth.setAttribute('d','M 62 97 Q 70 91 78 97');cheese.style.display='none';}
  else{[pL,pR].forEach(p=>{p.setAttribute('cy','68');p.setAttribute('r','4');});
    gL.style.display=gR.style.display='';mouth.setAttribute('d','M 62 93 Q 70 99 78 93');cheese.style.display='none';}
}

function setLevel(l){
  level=l;
  document.querySelectorAll('.level-btn').forEach((b,i)=>b.classList.toggle('active',i+1===l));
  document.getElementById('levelBadge').textContent=LEVELS[l].label;
  restartGame();
}
function setOp(o){
  op=o;
  document.querySelectorAll('.op-btn').forEach((b,i)=>b.classList.toggle('active',['add','sub','both'][i]===o));
  restartGame();
}
function nextLevel(){if(level<4)setLevel(level+1);else restartGame();}

function generateQuestion(){
  const cfg=LEVELS[level];let a,b,useAdd,hintText='';
  if(op==='add')useAdd=true;else if(op==='sub')useAdd=false;else useAdd=Math.random()>.5;
  if(useAdd){
    if(cfg.crossTen&&Math.random()>.4){
      const dec=Math.floor(Math.random()*Math.floor((cfg.max-10)/10))*10;
      const rem=Math.floor(Math.random()*8)+1;
      a=dec+rem;const cross=10-rem;
      b=cross+Math.floor(Math.random()*Math.min(9,cfg.max-a-cross));
      if(b<=0)b=cross;
    } else {
      a=Math.floor(Math.random()*(cfg.max-1))+1;
      b=Math.floor(Math.random()*(cfg.max-a))+1;
    }
    correctAnswer=a+b;
    if(correctAnswer>cfg.max){a=Math.max(1,cfg.max-9);b=Math.floor(Math.random()*9)+1;correctAnswer=a+b;}
    if(cfg.crossTen&&correctAnswer>10&&a%10!==0&&b%10!==0) hintText='💡 Считай через десяток!';
  } else {
    if(cfg.crossTen&&Math.random()>.4){
      const dec=(Math.floor(Math.random()*Math.floor(cfg.max/10))+1)*10;
      a=dec+Math.floor(Math.random()*Math.min(9,cfg.max-dec));
      b=Math.floor(Math.random()*(dec%10===0?Math.min(9,a-dec+1):a-(dec-10)))+1;
      if(a<=0||b<=0||b>=a){a=15;b=7;}
    } else {
      a=Math.floor(Math.random()*(cfg.max-1))+2;
      b=Math.floor(Math.random()*(a-1))+1;
    }
    correctAnswer=a-b;if(correctAnswer<0){a=10;b=3;correctAnswer=7;}
  }

  document.getElementById('hint').textContent=hintText;
  const opSign=useAdd?'+':'−', opWord=useAdd?'плюс':'минус';
  currentTaskText=`${a} ${opWord} ${b} — сколько получится?`;
  document.getElementById('taskExpr').innerHTML=
    `<span>${a}</span><span class="op"> ${opSign} </span><span>${b}</span><span class="eq"> = </span><span>?</span>`;

  const spread=cfg.max<=10?3:cfg.max<=20?5:10;
  const choices=new Set([correctAnswer]);let tries=0;
  while(choices.size<4&&tries<100){
    tries++;const d=Math.floor(Math.random()*spread)+1;
    const w=correctAnswer+(Math.random()>.5?d:-d);
    if(w>=0&&w<=cfg.max+5&&w!==correctAnswer)choices.add(w);
  }
  while(choices.size<4)choices.add(correctAnswer+choices.size);

  const grid=document.getElementById('answersGrid');grid.innerHTML='';
  [...choices].sort(()=>Math.random()-.5).forEach(n=>{
    const btn=document.createElement('button');btn.className='answer-btn';btn.textContent=n;
    btn.onclick=()=>checkAnswer(n,btn);grid.appendChild(btn);
  });

  setMouseMood('thinking');
  const phrase=rnd(phrases.ask);setBubble(phrase,'');
  const nb=document.getElementById('nextBtn');nb.disabled=true;nb.textContent='Выбери ответ ↑';
  answered=false;stopVoice();
  speakNow(phrase).then(()=>speakNow(currentTaskText)).catch(()=>{});
}

function checkAnswer(chosen,btn){
  if(answered)return;answered=true;stopVoice();
  document.querySelectorAll('.answer-btn').forEach(b=>b.disabled=true);
  const nb=document.getElementById('nextBtn');
  if(chosen===correctAnswer){
    btn.classList.add('correct');correctCount++;cheesePieces++;streak++;
    document.getElementById('correctCount').textContent=correctCount;
    addCheese();setMouseMood('happy');
    let phrase;
    if(streak===5)phrase=rnd(phrases.streak5);
    else if(streak===3)phrase=rnd(phrases.streak3);
    else phrase=rnd(phrases.correct);
    setBubble(phrase,'happy-bubble');speakNow(phrase);
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.answer-btn').forEach(b=>{if(parseInt(b.textContent)===correctAnswer)b.classList.add('correct');});
    wrongCount++;streak=0;document.getElementById('wrongCount').textContent=wrongCount;
    setMouseMood('sad');const phrase=rnd(phrases.wrong);setBubble(phrase,'sad-bubble');
    speakNow(phrase).then(()=>speakNow(`Правильный ответ — ${correctAnswer}`)).catch(()=>{});
  }
  questionIndex++;updateProgress();
  if(questionIndex>=TOTAL){setTimeout(showWin,1400);}
  else{nb.disabled=false;nb.textContent='Дальше! →';}
}

function nextQuestion(){generateQuestion();}
function updateProgress(){
  document.getElementById('progressFill').style.width=(questionIndex/TOTAL*100)+'%';
  document.getElementById('progressText').textContent=questionIndex+'/'+TOTAL;
}
function addCheese(){
  const s=document.createElement('span');s.className='cheese-piece';s.textContent='🧀';
  document.getElementById('cheeseRow').appendChild(s);
}
function setBubble(text,cls){
  const b=document.getElementById('bubble');if(b){b.textContent=text;b.className='bubble '+cls;}
}

function showWin(){
  stopVoice();
  document.getElementById('taskSection').style.display='none';
  document.getElementById('winOverlay').classList.add('visible');
  setMouseMood('happy');
  const cfg=LEVELS[level];const pct=correctCount/TOTAL;
  let stars,title,sub,speech;
  if(pct>=.9){
    stars='⭐⭐⭐';title='Кладовочка полная!';
    sub=`${correctCount} из ${TOTAL} правильно! Уровень «${cfg.name}» покорён!`;
    speech=`Ура! ${correctCount} из ${TOTAL}! `+rnd(phrases.win3);
  } else if(pct>=.6){
    stars='⭐⭐';title='Хорошая работа!';
    sub=`${correctCount} из ${TOTAL}. Нюсик доволен!`;
    speech=`${correctCount} из ${TOTAL}. `+rnd(phrases.win2);
  } else {
    stars='⭐';title='Нюсик верит в тебя!';
    sub=`${correctCount} из ${TOTAL}. Попробуем ещё раз!`;
    speech=rnd(phrases.win1);
  }
  document.getElementById('winStars').textContent=stars;
  document.getElementById('winTitle').textContent=title;
  document.getElementById('winSubtitle').textContent=sub;
  document.querySelector('.restart-btn.secondary').style.display=level>=4?'none':'';
  speakAfter(speech,400);
}

function restartGame(){
  stopVoice();questionIndex=0;correctCount=0;wrongCount=0;cheesePieces=0;streak=0;
  document.getElementById('cheeseRow').innerHTML='';
  document.getElementById('correctCount').textContent='0';
  document.getElementById('wrongCount').textContent='0';
  document.getElementById('taskSection').style.display='';
  document.getElementById('winOverlay').classList.remove('visible');
  updateProgress();generateQuestion();
}
