<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Семейный бюджет</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#faf7f5;--bg2:#f3ede8;--surface:#fff;--surface2:#fdf9f7;
  --border:#e8ddd7;--border2:#d4c8c0;--text:#3d2c26;--text-m:#8a7068;--text-l:#b8a8a0;
  --accent:#c084a0;--accent2:#9b6fa8;--accent-l:rgba(192,132,160,0.12);
  --green:#6dab8a;--green-l:rgba(109,171,138,0.12);
  --red:#d97070;--red-l:rgba(217,112,112,0.12);
  --warn:#d4946a;--warn-l:rgba(212,148,106,0.12);
  --lavender:#b8a0d4;--peach:#f0c8a0;--mint:#a0c8b8;
  --radius:16px;--radius-sm:10px;
  --shadow:0 2px 16px rgba(100,60,40,0.08);--shadow-lg:0 8px 32px rgba(100,60,40,0.12);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);font-size:15px;min-height:100vh}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 32px;height:68px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
.topbar-logo{font-size:20px;font-weight:900;color:var(--text);letter-spacing:-.5px}
.topbar-logo span{color:var(--accent)}
.topbar-right{display:flex;align-items:center;gap:10px}
.month-nav{display:flex;align-items:center;gap:6px;background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--radius);padding:6px 14px}
.month-label{font-size:15px;font-weight:800;min-width:155px;text-align:center}
.main-tabs{display:flex;gap:2px;padding:0 32px;border-bottom:2px solid var(--border);background:var(--surface)}
.main-tab{padding:14px 20px;font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;border:none;background:none;color:var(--text-m);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;border-radius:8px 8px 0 0;transition:all .15s}
.main-tab:hover{color:var(--accent);background:var(--accent-l)}
.main-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.main{padding:28px 32px 56px;max-width:1400px;margin:0 auto;width:100%}
.summary-bar{display:flex;align-items:stretch;gap:12px;margin-bottom:28px;flex-wrap:wrap}
.summary-card{flex:1;min-width:130px;text-align:center;padding:18px 12px;border-radius:var(--radius);border:1.5px solid var(--border);background:var(--surface);box-shadow:var(--shadow)}
.s-income{border-color:rgba(109,171,138,.35);background:linear-gradient(135deg,#fff,#f0faf5)}
.s-expense{border-color:rgba(217,112,112,.3);background:linear-gradient(135deg,#fff,#fdf2f2)}
.s-balance{border-color:rgba(192,132,160,.35);background:linear-gradient(135deg,#fff,#fdf0f6)}
.s-savings{border-color:rgba(184,160,212,.35);background:linear-gradient(135deg,#fff,#f8f0fd)}
.s-free{border-color:rgba(212,148,106,.3);background:linear-gradient(135deg,#fff,#fdf6ee)}
.s-balance.neg{border-color:var(--red)!important;background:var(--red-l)!important}
.s-savings.warn{border-color:var(--warn)!important;background:var(--warn-l)!important}
.s-icon{font-size:22px;margin-bottom:6px}
.s-val{font-size:18px;font-weight:900;letter-spacing:-.5px}
.s-lbl{font-size:10px;color:var(--text-m);margin-top:3px;text-transform:uppercase;letter-spacing:.8px;font-weight:700}
.s-sub{font-size:11px;color:var(--text-l);margin-top:2px}
.s-arrow{font-size:20px;color:var(--text-l);display:flex;align-items:center;padding:0 2px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.b-section{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:20px;box-shadow:var(--shadow)}
.b-section-header{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.b-section-title{font-size:16px;font-weight:800;flex:1}
.b-badge{font-size:13px;font-weight:700;padding:4px 12px;border-radius:20px}
.badge-green{background:var(--green-l);color:var(--green)}
.badge-red{background:var(--red-l);color:var(--red)}
.badge-warn{background:var(--warn-l);color:var(--warn)}
.badge-accent{background:var(--accent-l);color:var(--accent)}
.income-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.income-card{background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:16px 14px;display:flex;flex-direction:column;gap:5px;position:relative;transition:box-shadow .2s}
.income-card:hover{box-shadow:var(--shadow-lg)}
.income-card.filled{border-color:rgba(109,171,138,.5);background:linear-gradient(135deg,#fff,#f4fbf7)}
.income-card.auto{border-color:rgba(192,132,160,.4)}
.i-icon{font-size:22px}.i-label{font-size:12px;color:var(--text-m);font-weight:700}
.i-auto-badge{position:absolute;top:8px;right:8px;font-size:9px;background:var(--accent-l);color:var(--accent);padding:2px 6px;border-radius:4px;font-weight:800;text-transform:uppercase}
.i-amount{font-size:18px;font-weight:900;color:var(--green)}
.i-amount.empty{color:var(--text-l);font-size:15px;font-weight:600}
.i-orig{font-size:11px;color:var(--text-m)}.i-note{font-size:11px;color:var(--text-l)}
.i-actions{margin-top:6px;display:flex;gap:6px}
.exp-totals{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.exp-category{border:1.5px solid var(--border);border-radius:var(--radius-sm);margin-bottom:10px;overflow:hidden}
.exp-cat--paid{border-color:rgba(109,171,138,.4)}.exp-cat--partial{border-color:rgba(212,148,106,.4)}
.exp-cat-header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--bg2);font-weight:800;font-size:14px}
.exp-cat-name{display:flex;align-items:center;gap:8px}
.exp-cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-paid{background:var(--green)}.dot-planned{background:var(--text-l)}.dot-partial{background:var(--warn)}
.exp-cat-total{font-size:13px;color:var(--text-m);font-weight:700}
.exp-row{display:flex;align-items:center;padding:10px 14px;border-top:1px solid var(--border);gap:10px;transition:background .12s}
.exp-row:hover{background:var(--bg2)}
.exp-row.row-paid{background:rgba(109,171,138,.04)}.exp-row.row-reserved{background:rgba(212,148,106,.05)}
.exp-row-info{flex:1;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.exp-row-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.exp-sub{font-size:14px;font-weight:600}.exp-note-text{font-size:12px;color:var(--text-l)}
.exp-amount{text-align:right;min-width:100px}
.amt-main{font-size:13px;font-weight:800;display:block}.amt-sub{font-size:11px;color:var(--text-m);display:block}
.recur-icon{font-size:13px;opacity:.5}
.status-sel{font-size:12px;padding:4px 8px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-family:'Nunito',sans-serif;cursor:pointer;font-weight:600}
.savings-warn-banner{background:var(--warn-l);border:1.5px solid rgba(212,148,106,.4);border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;color:var(--warn);margin-bottom:14px;font-weight:700}
.sav-total-block{background:linear-gradient(135deg,var(--accent-l),rgba(184,160,212,.15));border:1.5px solid rgba(192,132,160,.25);border-radius:var(--radius-sm);padding:14px 18px;text-align:center;margin-bottom:14px}
.sav-total-label{font-size:11px;color:var(--text-m);text-transform:uppercase;letter-spacing:.8px;font-weight:700}
.sav-total-val{font-size:30px;font-weight:900;color:var(--accent2);letter-spacing:-1px;margin-top:2px}
.sav-stats{display:flex;gap:10px;margin-bottom:14px}
.sav-stat{flex:1;display:flex;justify-content:space-between;padding:8px 12px;border-radius:var(--radius-sm);font-size:13px;font-weight:700}
.sav-add{background:var(--green-l);color:var(--green)}.sav-withdraw{background:var(--red-l);color:var(--red)}
.sav-actions{display:flex;gap:8px;margin-bottom:14px}
.sav-history{display:flex;flex-direction:column;gap:6px}
.sav-row{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--radius-sm);font-size:13px;font-weight:700}
.srow-add{background:var(--green-l);color:var(--green)}.srow-withdraw{background:var(--red-l);color:var(--red)}
.sav-note{font-weight:500;color:var(--text-m);flex:1}
.analytics-compare{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.analytics-period{background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px}
.analytics-period-title{font-size:12px;font-weight:700;color:var(--text-m);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.a-bars{display:flex;flex-direction:column;gap:10px}
.a-row{display:flex;align-items:center;gap:10px}
.a-cat{width:130px;font-size:12px;color:var(--text-m);flex-shrink:0;font-weight:600}
.a-bar-wrap{flex:1;height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.a-bar{height:100%;border-radius:4px;transition:width .5s ease;min-width:2px}
.a-bar-cur{background:linear-gradient(90deg,var(--accent),var(--lavender))}
.a-bar-prev{background:linear-gradient(90deg,var(--mint),#a0c8d4)}
.a-amt{font-size:12px;font-weight:800;min-width:90px;text-align:right}
.a-diff{font-size:11px;min-width:50px;text-align:right;font-weight:700}
.diff-up{color:var(--red)}.diff-down{color:var(--green)}
.tx-list{display:flex;flex-direction:column;gap:6px}
.tx-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--radius-sm);background:var(--surface);border:1.5px solid var(--border);transition:box-shadow .15s}
.tx-row:hover{box-shadow:var(--shadow)}
.tx-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.tx-dot-income{background:var(--green)}.tx-dot-expense{background:var(--red)}.tx-dot-saving{background:var(--lavender)}
.tx-info{flex:1}.tx-title{font-size:14px;font-weight:700}.tx-sub{font-size:12px;color:var(--text-m)}
.tx-amount{font-size:15px;font-weight:900}
.tx-inc{color:var(--green)}.tx-exp{color:var(--red)}.tx-sav{color:var(--lavender)}
.tx-filter{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.b-btn{padding:9px 18px;border:none;border-radius:var(--radius-sm);font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.b-btn-accent{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 2px 8px rgba(192,132,160,.35)}
.b-btn-accent:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(192,132,160,.45)}
.b-btn-ghost{background:var(--bg2);color:var(--text);border:1.5px solid var(--border)}
.b-btn-ghost:hover{background:var(--border)}
.b-btn-danger{background:var(--red-l);color:var(--red);border:1.5px solid rgba(217,112,112,.3)}
.b-btn-sm{padding:5px 12px;font-size:12px}
.b-btn-icon{background:none;color:var(--text-l);padding:4px 6px;font-size:14px}
.b-btn-icon:hover{color:var(--accent)}
.filter-btn{padding:6px 14px;border:1.5px solid var(--border);border-radius:20px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;cursor:pointer;background:var(--surface);color:var(--text-m);transition:all .15s}
.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
#b-overlay{position:fixed;inset:0;background:rgba(60,30,20,.45);backdrop-filter:blur(6px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
#b-overlay.hidden{display:none}
.b-modal{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);min-width:360px;max-width:580px;width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.b-modal-lg{max-width:720px}
.b-modal-header{display:flex;justify-content:space-between;align-items:center;padding:20px 24px 16px;border-bottom:1.5px solid var(--border)}
.b-modal-title{font-size:17px;font-weight:900}
.b-modal-body{padding:20px 24px;overflow-y:auto;flex:1}
.b-modal-footer{display:flex;justify-content:flex-end;gap:8px;padding:16px 24px;border-top:1.5px solid var(--border)}
.b-form-row{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.b-form-group{flex:1;min-width:110px;display:flex;flex-direction:column;gap:5px}
.b-form-group label{font-size:11px;font-weight:800;color:var(--text-m);text-transform:uppercase;letter-spacing:.6px}
.b-input{width:100%;padding:10px 13px;background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:'Nunito',sans-serif;font-size:14px;font-weight:600;outline:none;transition:border-color .15s}
.b-input:focus{border-color:var(--accent);background:#fff}
.b-cur-sel{padding:10px 13px;background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:'Nunito',sans-serif;font-size:14px;font-weight:600;cursor:pointer;width:100%}
.b-info-box{background:var(--accent-l);border:1.5px solid rgba(192,132,160,.2);border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;color:var(--text-m);margin-bottom:14px;font-weight:600}
.b-divider{height:1.5px;background:var(--border);margin:18px 0}
.b-settings-title{font-size:12px;font-weight:800;color:var(--text-m);text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px}
.recurring-list{display:flex;flex-direction:column;gap:8px}
.recurring-row{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg2);border-radius:var(--radius-sm);border:1.5px solid var(--border);flex-wrap:wrap}
.recurring-info{flex:1}.recurring-cat{font-size:13px;font-weight:800}.recurring-sub{font-size:12px;color:var(--text-m)}
.recurring-amount{font-size:13px;font-weight:900;color:var(--red);min-width:80px;text-align:right}
.recurring-freq{font-size:11px;color:var(--text-l);min-width:60px;text-align:center;font-weight:700}
#b-toast{position:fixed;bottom:24px;right:24px;z-index:2000;display:flex;flex-direction:column;gap:8px}
.b-toast-msg{padding:11px 20px;border-radius:var(--radius-sm);font-size:14px;font-weight:700;color:#fff;box-shadow:var(--shadow-lg);animation:toastIn .2s ease;font-family:'Nunito',sans-serif}
@keyframes toastIn{from{transform:translateX(40px);opacity:0}to{transform:translateX(0);opacity:1}}
.b-spinner{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--text-m);font-size:16px;gap:12px;font-weight:700}
.b-spinner::before{content:'';width:22px;height:22px;border:2.5px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:768px){
  .topbar,.main-tabs{padding-left:16px;padding-right:16px}
  .main{padding:16px 16px 48px}
  .two-col{grid-template-columns:1fr}
  .summary-bar{gap:6px}
  .summary-card{min-width:110px;padding:12px 8px}
  .s-val{font-size:15px}
  .analytics-compare{grid-template-columns:1fr}
  .b-modal{min-width:unset}
}
</style>
</head>
<body>
<div id="b-overlay" class="hidden" onclick="if(event.target===this)bCloseModal()">
  <div id="b-modal-container"></div>
</div>
<div id="b-toast"></div>
<div class="topbar">
  <div class="topbar-logo">🌸 Семейный <span>бюджет</span></div>
  <div class="topbar-right">
    <div class="month-nav">
      <button class="b-btn b-btn-ghost b-btn-sm" onclick="changeMonth(-1)">‹</button>
      <div class="month-label" id="month-display">—</div>
      <button class="b-btn b-btn-ghost b-btn-sm" onclick="changeMonth(1)">›</button>
    </div>
    <button class="b-btn b-btn-ghost b-btn-sm" onclick="syncIncomeFromCRM(currentMonth)" title="Синхронизировать из CRM">🔄</button>
    <button class="b-btn b-btn-ghost b-btn-sm" onclick="openBudgetSettings()">⚙️</button>
  </div>
</div>
<div class="main-tabs">
  <button class="main-tab active" onclick="switchTab('overview')">📊 Обзор</button>
  <button class="main-tab" onclick="switchTab('transactions')">📋 Транзакции</button>
  <button class="main-tab" onclick="switchTab('analytics')">📈 Аналитика</button>
</div>
<div class="main" id="main-content">
  <div class="b-spinner">Загрузка...</div>
</div>
<div id="print-area" style="display:none"></div>
<script src="js/budget-config.js?v=2"></script>
<script src="js/budget-utils.js?v=2"></script>
<script src="js/budget-income.js?v=2"></script>
<script src="js/budget-expenses.js?v=2"></script>
<script src="js/budget-savings.js?v=2"></script>
<script src="js/budget-analytics.js?v=2"></script>
<script src="js/budget-settings.js?v=2"></script>
<script src="js/budget-transactions.js?v=2"></script>
<script>
let currentTab='overview';
function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('.main-tab').forEach((b,i)=>{
    b.classList.toggle('active',['overview','transactions','analytics'][i]===tab);
  });
  renderCurrentTab();
}
async function renderCurrentTab(){
  if(currentTab==='overview') await renderOverview(currentMonth);
  else if(currentTab==='transactions') await renderTransactions(currentMonth);
  else if(currentTab==='analytics') await renderAnalytics(currentMonth);
}
async function renderMonth(month){
  currentMonth=month;
  document.getElementById('month-display').textContent=monthLabel(month);
  document.getElementById('main-content').innerHTML='<div class="b-spinner">Загрузка...</div>';
  await loadRates();
  await renderCurrentTab();
}
async function renderOverview(month){
  await ensureRecurringForMonth(month);
  const[income,expenses,savings]=await Promise.all([loadIncome(month),loadExpenses(month),loadSavings(month)]);
  document.getElementById('main-content').innerHTML=`
    ${renderSummaryBar(income,expenses,savings,month)}
    <div class="two-col">
      <div>${renderIncomeSection(income,month)}${renderSavingsSection(savings,month)}</div>
      <div>${renderExpensesSection(expenses,month)}</div>
    </div>`;
}
function changeMonth(dir){renderMonth(dir>0?nextMonth(currentMonth):prevMonth(currentMonth));}
window.addEventListener('DOMContentLoaded',async()=>{
  await renderMonth(currentMonth);
  syncAnyaOpticaIncome(currentMonth).catch(()=>{});
});
</script>
</body>
</html>
